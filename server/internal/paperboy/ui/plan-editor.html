{{define "title-actions"}}<button id="rename" type="button" hidden>Rename</button><button id="delete" type="button" class="danger" hidden>Delete</button><button id="reload" type="button">Reload</button><button class="primary" id="save" type="button">Save</button>{{end}}
<!doctype html>
<html lang="en">
<head>
{{template "head" .}}
<title>{{.Name}} · Plan editor · Paperboy</title>
<style>
a { color: var(--pb-accent); }
button.small { padding: .05rem .45rem; font-size: .8rem; line-height: 1.3; }
.error { margin: .5rem 0; padding: .5rem .6rem; background: var(--pb-error-bg); border-left: 3px solid var(--pb-error-border); font-size: .85rem; word-break: break-word; }
.columns { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 1rem; align-items: start; }
@media (max-width: 62rem) { .columns { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.panel-head { margin-bottom: .4rem; }
.panel-head h3 { font-size: .95rem; margin: 0; }
.panel-head button { margin-left: auto; }
.panel h3 { font-size: .95rem; margin: 0 0 .4rem; }
.hint { margin: .3rem 0 .5rem; }
label.field { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .3rem .5rem; align-items: center; font-size: .85rem; }
label.field > span:first-child { color: var(--pb-ink-muted); }
input, select { font: inherit; padding: .15rem .3rem; min-width: 0; width: 100%; }
input[type=checkbox] { width: auto; }
.rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: .4rem .8rem; }
/* order rows */
.entry { border: 1px solid var(--pb-hairline); border-radius: 8px; padding: .55rem .6rem; margin-top: .5rem; background: var(--pb-surface-sunken); }
.entry-head { display: flex; align-items: center; gap: .4rem; margin-bottom: .35rem; }
.entry-head .num { font-size: .8rem; color: var(--pb-ink-muted); font-variant-numeric: tabular-nums; }
.entry-head .buttons { margin-left: auto; display: flex; gap: .3rem; }
.entry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .35rem .7rem; }
/* The page and the alert of a trigger need room for a page name. */
.entry-grid.trigger-grid { grid-template-columns: minmax(14rem, 2fr) minmax(9rem, 1fr); }
.days { display: flex; flex-wrap: wrap; gap: .35rem; font-size: .82rem; }
.days label { display: flex; gap: .15rem; align-items: center; }
label.field.wide { grid-column: 1 / -1; }
.page-row { display: flex; gap: .35rem; align-items: center; background: var(--pb-surface); border: 1px solid var(--pb-hairline); border-radius: 4px; padding: .1rem .35rem; font-size: .84rem; margin-top: .3rem; }
.page-row.hidden { opacity: .62; }
.page-row .labels { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .4rem; }
.page-row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page-row .labels .muted { min-width: 0; font-size: .78rem; overflow-wrap: anywhere; }
.page-row.missing { background: var(--pb-error-bg); border-color: var(--pb-error-border); }
.page-row .flag { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--pb-ink-muted); border: 1px solid var(--pb-hairline-strong); border-radius: 999px; padding: 0 .35rem; }
.add-row { display: flex; gap: .4rem; align-items: center; margin-top: .45rem; font-size: .84rem; }
.add-row select { flex: 1; }
.conditions { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.condition { display: grid; grid-template-columns: minmax(16rem, 1fr) minmax(0, 2fr) auto; gap: .3rem .5rem; align-items: start; }
.condition .fields { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; min-width: 0; }
.condition .fields label { display: inline-flex; gap: .2rem; align-items: center; font-size: .8rem; }
.condition .fields input[type=time] { width: auto; }
.condition .fields .cond-time, .condition .fields .cond-dates { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; min-width: 0; }
.condition .fields .cond-dates { flex: 1; }
.condition .fields .cond-dates input { min-width: 12rem; }
.condition .keys { display: flex; flex-wrap: wrap; gap: .15rem .5rem; align-items: center; }
.condition .keys label { display: inline-flex; gap: .2rem; align-items: center; font-size: .8rem; }
.condition .remove { padding: .05rem .4rem; border: 1px solid var(--pb-error-border); border-radius: 4px; background: var(--pb-error-bg); color: var(--pb-error); cursor: pointer; }
.conditions > button { align-self: flex-start; }
.warn { margin: .35rem 0 0; padding: .3rem .55rem; font-size: .8rem; background: var(--pb-warn-bg); border-left: 3px solid var(--pb-warn); }
.warn ul { margin: 0; padding-left: 1rem; }
.warn p { margin: 0; }
/* actions */
.action { border: 1px solid var(--pb-hairline); border-radius: 8px; padding: .6rem; margin-top: .6rem; background: var(--pb-surface-sunken); }
.action-head { display: flex; gap: .4rem; align-items: center; margin-bottom: .4rem; }
.action-head select { flex: 1; }
.action .arg { margin-top: .35rem; }
.action .arg .name { font-size: .78rem; color: var(--pb-ink-muted); display: block; }
.action .arg .desc { font-size: .72rem; color: var(--pb-ink-faint); display: block; }
.action .arg .checks { margin-top: .25rem; }
.action .arg .checks-bar { display: flex; align-items: center; gap: .4rem; margin-bottom: .3rem; font-size: .74rem; color: var(--pb-ink-muted); }
.action .arg .checks-count { font-variant-numeric: tabular-nums; }
.action .arg .checks-actions { display: flex; gap: .25rem; margin-left: auto; }
.action .arg .checks-actions button { font: inherit; font-size: .74rem; padding: .05rem .45rem; border: 1px solid var(--pb-hairline-strong); border-radius: 999px; background: var(--pb-surface-sunken); color: var(--pb-accent); cursor: pointer; }
.action .arg .checks-actions button:hover { background: var(--pb-accent-bg); border-color: var(--pb-hairline-strong); }
.action .arg .checks-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .15rem .35rem; }
.action .arg .check { display: flex; align-items: center; gap: .35rem; min-width: 0; padding: .18rem .3rem; border: 1px solid transparent; border-radius: 4px; font-size: .78rem; line-height: 1.25; color: var(--pb-ink); cursor: pointer; }
.action .arg .check:hover { background: var(--pb-surface-sunken); }
.action .arg .check:has(input:checked) { background: var(--pb-accent-bg); border-color: var(--pb-hairline-strong); color: var(--pb-accent); }
.action .arg .check input { flex: none; margin: 0; }
.action .arg .check span { min-width: 0; overflow-wrap: anywhere; }
.action .note { font-size: .75rem; color: var(--pb-ink-muted); }
/* devices */
#devices .device { display: flex; gap: .5rem; align-items: baseline; font-size: .88rem; padding: .1rem 0; }
#devices .device .edit { margin-left: auto; font-size: .8rem; }
#devices p { margin: 0; font-size: .85rem; color: var(--pb-ink-faint); }
</style>
</head>
<body>
{{template "chrome" .}}
{{if .Error}}
<p class="error">{{.Error}}</p>
{{else}}
<div class="columns">
  <div class="col">
    <section class="panel">
      <div class="panel-head">
        <h3>Pages</h3>
      </div>
      <div id="pages"></div>
      <div class="add-row">
        <select id="add-page-select"></select>
        <button id="add-page" type="button">Add page</button>
      </div>
      <div id="page-warnings"></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h3>Refresh</h3>
        <button id="add-window" type="button">Add window</button>
      </div>
      <div class="rule-grid">
        <label class="field"><span>Default</span><input id="refresh-default" type="text" autocomplete="off" placeholder="e.g. 1h"></label>
        <label class="field"><span>On refresh</span>
          <select id="on-refresh">
            <option value="current">current</option>
            <option value="first">first</option>
            <option value="cycle">cycle</option>
          </select>
        </label>
      </div>
      <div id="windows"></div>
      <div id="refresh-warnings"></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h3>Triggers</h3>
        <button id="add-trigger" type="button">Add trigger</button>
      </div>
      <div id="triggers"></div>
      <div id="trigger-warnings"></div>
    </section>
  </div>
  <div class="col">
    <section class="panel">
      <div class="panel-head">
        <h3>Actions</h3>
        <button id="add-action" type="button">Add action</button>
      </div>
      <div id="actions"></div>
      <div id="action-warnings"></div>
    </section>
    <section class="panel">
      <h3>Devices</h3>
      <div id="devices"></div>
    </section>
  </div>
</div>
<script id="plan-data" type="application/json">{{.Data}}</script>
<script src="/ui/dialog.js"></script>
<script src="/ui/plan-editor.js"></script>
{{end}}
{{template "chrome-end"}}</body>
</html>
