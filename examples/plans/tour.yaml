# Tour through all shipped plugins. The device turns to the next page with
# every refresh; the schedule keeps it fast during the day and quiet at night.
# The triggers bring a page to the front while a condition holds. A missing
# value never matches, so the tour continues. `glukose-kinder` is the page with
# the smiley in the rotation. `glukose`, `glukose-profil` and `netzwerk` are
# hidden: they are not in the rotation, and a trigger or the operator shows
# them. All count as demand, so the plugins keep polling for the profile and
# the network state.
pages:
  - uebersicht
  - status
  - energie
  - energie-woche
  - ertrag
  - werte
  - glukose-kinder
  - unterwegs
  - woche
  - kalender
  - wetter
  - himmel
  - laden
  - auto
  - heizung
  - abfahrten
  - nachrichten
  - github
  - spritpreise
  - pokemon
  - comic
  - countdown
  - geburtstage
  - drucker
  - { page: glukose, hidden: true }
  - { page: glukose-profil, hidden: true }
  - { page: netzwerk, hidden: true }

on_refresh: cycle
refresh:
  default: 30m
  windows:
    - { from: "07:00", to: "22:00", interval: 10m }

triggers:
  - when: { value: prusalink/state, is: [printing, paused] }
    page: drucker
    alert: once
  - when: { value: dexcom/state, is: [low, urgent, high] }
    page: glukose
    alert: refresh
  - when: { value: unifi/state, is: [degraded] }
    page: netzwerk
    alert: once
  - when:
      - { value: weekday, is: [mon, tue, wed, thu, fri] }
      - { value: time, from: "06:00", to: "09:00" }
    page: unterwegs
