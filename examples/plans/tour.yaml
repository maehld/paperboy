# Tour through all shipped plugins. During the day the device turns to the
# next page with every refresh; on weekday mornings it shows what matters
# before leaving the house, and at night it stays on the overview. The first
# rule shows the glucose page while the dexcom state is out of its band; a
# missing value never matches, so the tour continues.
rules:
  - name: glucose
    when: { conditions: [{ value: dexcom/state, is: [low, urgent, high] }] }
    pages: [glukose]
    refresh: 5m
  - name: morning
    when: { from: "06:00", to: "09:00", days: [mon, tue, wed, thu, fri] }
    pages: [unterwegs, uebersicht, woche, energie]
    on_refresh: cycle
    refresh: 5m
  - name: day
    when: { from: "07:00", to: "22:00" }
    pages: [uebersicht, status, energie, ertrag, werte, unterwegs, woche, kalender, wetter, laden, auto, glukose, abfahrten, nachrichten, spritpreise, pokemon, comic, countdown, geburtstage]
    on_refresh: cycle
    refresh: 10m
  - name: night
    when: { from: "22:00", to: "07:00" }
    pages: [uebersicht]
    refresh: 30m
fallback: day
