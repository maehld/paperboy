# A plan is an ordered list of pages and a refresh schedule. The device cycles
# through the pages on every timed refresh; the schedule keeps the day fast and
# the night quiet. `hinweise` is a text page, so image displays skip it.
pages: [uebersicht, kalender, wetter, laden, hinweise]

on_refresh: cycle
refresh:
  default: 30m
  windows:
    - { from: "07:00", to: "22:00", interval: 10m }

# A trigger brings a page to the front while a plugin value matches (ADR 0127).
# This one needs the dexcom plugin and a page named glukose; a hidden page is
# not in the rotation and only a trigger shows it. A missing value never
# matches, so the device continues with its pages.
# triggers:
#   - when: { value: dexcom/state, is: [low, urgent] }
#     page: glukose
#     alert: refresh
#
# A trigger also takes a time window, weekdays or single calendar days:
#   - when: [{ value: time, from: "06:00", to: "09:00" }]
#     page: uebersicht
#   - when: [{ value: date, from: "2026-12-24", to: "2026-12-26" }]
#     page: weihnachten

# Actions the device menu offers (ADR 0057). They belong to the plan, so every
# page above offers them. evcc's "mode" action switches the charge mode of one
# loadpoint; see docs/plugins/evcc.md. Uncomment one "now" and one "PV only"
# entry per loadpoint you can reach from the display.
# actions:
#   - { action: evcc/mode, args: { loadpoint: 0, mode: now }, id: charge-now, title: "Charge now" }
#   - { action: evcc/mode, args: { loadpoint: 0, mode: pv }, id: charge-pv, title: "PV only" }
#   - { action: evcc/mode, args: { loadpoint: 1, mode: now }, id: charge-now-2, title: "Charge now" }
#   - { action: paperboy/refresh }
#
# The myskoda plugin starts and stops charging and air conditioning of the car
# (docs/plugins/myskoda.md); temperature is optional and defaults to the car's
# current target.
#   - { action: myskoda/charging, args: { state: start }, id: charge-start, title: "Laden starten" }
#   - { action: myskoda/charging, args: { state: stop }, id: charge-stop, title: "Laden stoppen" }
#   - { action: myskoda/climate, args: { state: start }, id: climate-start, title: "Klima starten" }
#   - { action: myskoda/climate, args: { state: stop }, id: climate-stop, title: "Klima stoppen" }
