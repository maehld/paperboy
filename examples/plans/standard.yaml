rules:
  - name: tag
    when: { from: "07:00", to: "22:00" }
    pages: [uebersicht, kalender, wetter, laden]
    refresh: 10m
  - name: nacht
    when: { from: "22:00", to: "07:00" }
    pages: [uebersicht]
    refresh: 30m
fallback: tag

# Actions the device menu offers (ADR 0057). They belong to the plan, so every
# page above offers them. evcc's "mode" action switches the charge mode of one
# loadpoint; see docs/plugins/evcc.md. Uncomment one "now" and one "PV only"
# entry per loadpoint you can reach from the display.
# actions:
#   - { action: evcc/mode, args: { loadpoint: 0, mode: now }, id: charge-now, title: "Charge now" }
#   - { action: evcc/mode, args: { loadpoint: 0, mode: pv }, id: charge-pv, title: "PV only" }
#   - { action: evcc/mode, args: { loadpoint: 1, mode: now }, id: charge-now-2, title: "Charge now" }
#   - { action: paperboy/refresh }
