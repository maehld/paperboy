# evcc: energy flow on top, site values and the charging point below. A short
# home shows the charge modes in the loadpoint cell; a tap runs one.
title: Energie
kind: image
grid: [6, 8]
style: { padding: 4.5, divider: 0.6 }
cells:
  - { at: [0, 0], span: [6, 4], widget: evcc/flow }
  - { at: [0, 4], span: [3, 4], widget: evcc/site, args: { columns: 2 } }
  - { at: [3, 4], span: [3, 4], widget: evcc/loadpoint, args: { index: 0 }, action: { name: mode, args: { index: 0 } } }
