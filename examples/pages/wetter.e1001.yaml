title: Wetter
watch:
  - { path: weather, stale_after: 45m, label: Wetter }
notices: badge
rows: [10, 24, 40, 26]
blocks:
  - name: kopf
    header:
      title: Wetter
      subtitle: '{{ .weather.current.text }} - {{ time .weather.today.sunrise }} bis {{ time .weather.today.sunset }}'
      align: left
      status: { time: weather/current/time, label: Stand }
      rule: 2
  - name: kacheln
    tiles:
      columns: 4
      divider: 2
      padding: 6
      items:
        - label: Jetzt
          value: weather/current/temp
          format: temp
          label_size: 0.16
          value_size: 0.32
        - label: Gefühlt
          value: weather/current/apparent
          format: temp
          label_size: 0.16
          value_size: 0.32
        - label: Regen
          value: weather/current/precip_prob
          format: percent
          label_size: 0.16
          value_size: 0.32
          detail_size: 0.14
          detail: 'Heute {{ percent .weather.today.precip_prob }}'
        - label: Wind
          value: weather/current/wind
          label_size: 0.16
          value_size: 0.32
          detail_size: 0.14
          detail: km/h
  - name: verlauf
    chart:
      points: weather/hours
      title: Temperatur heute
      unit: °C
      time: true
      axis: true
      ticks: 6h
      now: true
      series:
        - { key: temp, style: area, fill: shade }
  - name: tage
    text:
      align: left
      padding: 6
      size: 0.55
      value: |-
        {{- range .weather.days }}
        {{ .label }}: {{ temp .min }} bis {{ temp .max }}, {{ .text }}
        {{- end }}
