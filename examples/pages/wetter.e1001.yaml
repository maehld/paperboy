title: Wetter
watch:
  - { path: weather, stale_after: 45m, label: Wetter }
notices: badge
rows: [10, 28, 34, 28]
blocks:
  - name: kopf
    header:
      title: Wetter
      subtitle: '{{ .weather.current.text }} - {{ time .weather.today.sunrise }} bis {{ time .weather.today.sunset }}'
      align: left
      status: { time: weather/current/time, label: Stand }
      rule: 2
  - name: jetzt
    columns:
      divider: 2
      items:
        - weight: 14
          block:
            icon: { source: '{{ if .weather.current.symbol }}{{ .weather.current.symbol }}.png{{ end }}', size: 0.7, padding: 6 }
        - weight: 50
          block:
            tiles:
              columns: 2
              divider: 2
              padding: 6
              items:
                - label: Jetzt
                  value: weather/current/temp
                  format: temp
                  label_size: 0.18
                  value_size: 0.34
                - label: Gefühlt
                  value: weather/current/apparent
                  format: temp
                  label_size: 0.18
                  value_size: 0.34
                - label: Regen
                  value: weather/current/precip_prob
                  format: percent
                  label_size: 0.18
                  value_size: 0.34
                  detail_size: 0.16
                  detail: 'Heute {{ percent .weather.today.precip_prob }}'
                - label: Wind
                  value: weather/current/wind
                  label_size: 0.18
                  value_size: 0.34
                  detail_size: 0.16
                  detail: '{{ .weather.current.beaufort }} Bft'
        - weight: 36
          block:
            icon:
              source: '{{ if .weather.current }}{{ if or (below .weather.current.apparent 15) (above .weather.current.beaufort 3) }}pullover{{ else }}tshirt{{ end }}.png{{ end }}'
              label: '{{ if or (below .weather.current.apparent 15) (above .weather.current.beaufort 3) }}Pullover{{ else }}T-Shirt{{ end }}'
              size: 0.95
              label_size: 0.75
  - name: verlauf
    chart:
      points: weather/hours
      title: Temperatur heute
      unit: °C
      time: true
      axis: true
      ticks: 6h
      now: true
      series:
        - { key: temp, style: area, fill: shade }
  - name: tage
    text:
      align: left
      padding: 6
      size: 0.55
      value: |-
        {{- range .weather.days }}
        {{ .label }}: {{ temp .min }} bis {{ temp .max }}, {{ .text }}
        {{- end }}
