# The next birthdays with the age from the birthday calendar
# (`birthday_calendars` in paperboy.yaml), next to the next few days with the
# age in the agenda.
title: Geburtstage
kind: image
variants: {lcd2004: lcd2004}
grid: [6, 8]
style: { padding: 4.5, divider: 0.6 }
cells:
  - { at: [0, 0], span: [4, 8], widget: calendar/birthdays, args: { lines: 12 } }
  - { at: [4, 0], span: [2, 8], widget: calendar/agenda, args: { lines: 12, days: 3, empty: false, age: true, calendars: [Privat] } }
