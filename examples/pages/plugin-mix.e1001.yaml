# Spike: plugin fragments. Tiles from two plugins on one page.
title: Übersicht
rows: [12, 50, 38]
blocks:
  - name: kopf
    header:
      title: Übersicht
      align: left
      status: { label: '{{ time now }}' }
      rule: 2
  - name: oben
    rule: 1
    columns:
      divider: 1
      items:
        - weight: 1
          block:
            plugin:
              name: calendar
              image: agenda
              args: { lines: 6, padding: 8 }
        - weight: 1
          block:
            plugin: solardemo/tiles
  - name: verlauf
    plugin: solardemo/chart
