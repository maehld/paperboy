# Solar overview for a 20x4 HD44780 text display (ADR 0044). Every line is a
# Go text template; pad, right and center place text in fixed columns, and
# fit shortens a value until it fits its column (ADR 0046). The single spaces
# between the columns keep values from touching.
title: Solar
watch:
  - { path: solar/current, stale_after: 5m, label: Solar }
lines:
  - '{{ pad 5 "PV" }}{{ fit 7 "power" .solar.current.latest.values.pv_power }}{{ right 8 (time .solar.current.latest.time) }}'
  - '{{ pad 5 "Akku" }}{{ fit 7 "power" .solar.current.latest.values.battery_power }} {{ fit 7 "percent" .solar.current.latest.values.battery_soc 3 }}'
  - '{{ pad 5 "Netz" }}{{ fit 7 "power" .solar.current.latest.values.grid_power }} {{ fit 7 "energy" .solar.current.latest.values.import_today 3 }}'
  - '{{ pad 5 "Heute" }}{{ fit 15 "energy" .solar.current.latest.values.pv_today }}'
