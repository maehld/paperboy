# Values on a 20x4 character display. The evcc plugin declares its values in a
# later protocol version (ADR 0111); until then this page uses Paperboy's own.
kind: text
rows:
  - [{ value: paperboy/title, width: 20, align: left }]
  - [{ value: paperboy/date, label: Datum, width: 20, align: left }]
  - [{ value: paperboy/time, label: Zeit, width: 20, align: right }]
  - [{ value: paperboy/now, label: Jetzt, width: 20, align: decimal }]
