# The battery, the room and the status of this device and of others (ADR 0109).
# The display type's header band shows the title, the room, its battery and the
# clock (ADR 0168). The two status cells show this device and a fixed
# list from the device files. The two gauges show the square form of the
# battery widget (ADR 0121). The last row shows the room as large values.
title: Status
kind: image
grid: [6, 7]
style: { padding: 4.5, divider: 0.6 }
cells:
  - { at: [0, 0], span: [6, 2], widget: paperboy/device-status }
  - { at: [0, 2], span: [6, 2], widget: paperboy/device-status, args: { devices: [wohnzimmer, lcd] } }
  - { at: [0, 4], span: [2, 1], widget: paperboy/battery }
  - { at: [2, 4], span: [2, 1], widget: paperboy/battery, args: { label: volts } }
  - { at: [4, 4], span: [2, 1], widget: paperboy/clock, args: { format: datetime } }
  - { at: [0, 5], span: [3, 2], widget: paperboy/reading, args: { label: true } }
  - { at: [3, 5], span: [3, 2], widget: paperboy/reading, args: { name: humidity, label: true } }
