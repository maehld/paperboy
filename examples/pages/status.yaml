# The battery and the status of this device and of others (ADR 0109). The
# header shows the battery of the device that renders the page; the two status
# cells show this device and a fixed list from the device files. The two
# gauges show the square form of the battery widget (ADR 0121).
title: Status
kind: image
grid: [6, 8]
style: { padding: 4.5, divider: 0.6 }
cells:
  - { at: [0, 0], span: [6, 1], widget: paperboy/header, args: { battery: true } }
  - { at: [0, 1], span: [6, 2], widget: paperboy/device-status }
  - { at: [0, 3], span: [6, 2], widget: paperboy/device-status, args: { devices: [wohnzimmer, lcd] } }
  - { at: [0, 5], span: [2, 2], widget: paperboy/battery }
  - { at: [2, 5], span: [2, 2], widget: paperboy/battery, args: { label: volts } }
  - { at: [4, 5], span: [2, 2], widget: paperboy/clock, args: { format: datetime } }
