title: Solar - Energiefluss
watch:
  - { path: solar/current, stale_after: 30m, label: Solar }
  - { path: solar/history, stale_after: 30m, label: Verlauf }
notices: badge
rows: [10, 26, 53, 11]
blocks:
  - name: kopf
    header:
      title: Solar - Energiefluss
      align: left
      status: { time: solar/current/latest/time, label: Stand }
      rule: 2
  - name: kacheln
    tiles:
      columns: 4
      divider: 2
      padding: 6
      items:
        - label: Solar
          value: solar/current/latest/values/pv_power
          format: power
          label_size: 0.16
          value_size: 0.30
        - label: Haus
          value: solar/current/latest/values/load_power
          format: power
          label_size: 0.16
          value_size: 0.30
        - label: Batterie
          value: solar/current/latest/values/battery_soc
          format: percent
          label_size: 0.16
          value_size: 0.30
          detail_size: 0.14
          detail: '{{ if below .solar.current.latest.values.battery_power -10 }}lädt {{ power .solar.current.latest.values.battery_power }}{{ else if above .solar.current.latest.values.battery_power 10 }}entlädt {{ power .solar.current.latest.values.battery_power }}{{ else }}ruht{{ end }}'
        - label: Netz
          value: solar/current/latest/values/grid_power
          format: power
          label_size: 0.16
          value_size: 0.30
          detail_size: 0.14
          detail: '{{ if above .solar.current.latest.values.grid_power 10 }}Einspeisung{{ else if below .solar.current.latest.values.grid_power -10 }}Bezug{{ else }}kein Fluss{{ end }}'
  - name: verlauf
    chart:
      points: solar/history/points
      title: 'Heute: Solar (Fläche) - Haus (Linie)'
      unit: kW
      time: true
      axis: true
      ticks: 6h
      now: true
      series:
        - { key: pv_power, style: area, fill: shade }
        - { key: load_power, style: line, weight: 3 }
  - name: fuss
    text:
      value: 'Heute: PV {{ energy .solar.current.latest.values.pv_today }} - Verbrauch {{ if .solar.derived.balance.approximate }}≈ {{ end }}{{ energy .solar.derived.balance.consumption }} - Bezug {{ energy .solar.current.latest.values.import_today }} - Einspeisung {{ energy .solar.current.latest.values.export_today }} - Autarkie {{ if .solar.derived.balance.approximate }}≈ {{ end }}{{ ratio .solar.derived.balance.autarky }}'
      align: center
      size: 0.40
