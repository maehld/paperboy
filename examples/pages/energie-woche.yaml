# evcc: the energy flow of this week as energy, not power, and the same split
# as a balance. The page header names the period; neither widget carries a
# label.
title: Energie · Woche
kind: image
grid: [6, 8]
style: { padding: 4.5, divider: 0.6 }
cells:
  - { at: [0, 0], span: [6, 4], widget: evcc/flow, args: { period: week } }
  - { at: [0, 4], span: [6, 4], widget: evcc/balance, args: { period: week } }
