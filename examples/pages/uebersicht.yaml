# Overview for image displays of any size: one file serves every display type
# without its own variant (ADR 0049). The grid has 6 columns and 8 rows.
title: Übersicht
grid: [6, 8]
style: { padding: 8, divider: 1 }
cells:
  - { at: [0, 0], span: [6, 1], widget: paperboy/header }
  - { at: [0, 1], span: [3, 3], widget: weather/current, args: { clothing: true } }
  - { at: [3, 1], span: [3, 3], widget: evcc/site, args: { columns: 2 } }
  - { at: [0, 4], span: [3, 4], widget: calendar/agenda, args: { lines: 7 } }
  - { at: [3, 4], span: [3, 4], widget: weather/days, args: { days: 3 } }
