# ADR 0034 defines `*_size` as a fraction of the block height, but the renderer
# currently uses an explicit size as a pixel value while validation only accepts
# fractions up to 1.5. The page therefore uses the built-in defaults, which
# follow the reference proportions.
#
# The footer keeps the energy summary in a text column and shows the autarky as
# a value with `format: ratio`, because the text helper `ratio` is missing.
title: Solar
watch:
  - { path: solar/current, stale_after: 30m, label: Solar }
notices: badge
rows: [13, 74, 13]
blocks:
  - name: kopf
    header:
      title: Solar
      align: left
      status: { time: solar/current/latest/time, label: Stand }
      rule: 2
  - name: kacheln
    tiles:
      columns: 2
      divider: 2
      padding: 10
      items:
        - label: Solar
          value: solar/current/latest/values/pv_power
          format: power
        - label: Haus
          value: solar/current/latest/values/load_power
          format: power
        - label: Batterie
          value: solar/current/latest/values/battery_soc
          format: percent
          detail: '{{ if below .solar.current.latest.values.battery_power -10 }}lädt {{ power .solar.current.latest.values.battery_power }}{{ else if above .solar.current.latest.values.battery_power 10 }}entlädt {{ power .solar.current.latest.values.battery_power }}{{ else }}ruht{{ end }}'
        - label: Netz
          value: solar/current/latest/values/grid_power
          format: power
          detail: '{{ if above .solar.current.latest.values.grid_power 10 }}Einspeisung{{ else if below .solar.current.latest.values.grid_power -10 }}Bezug{{ else }}kein Fluss{{ end }}'
  - name: fuss
    columns:
      items:
        - weight: 80
          block:
            text:
              value: 'Heute: PV {{ energy .solar.current.latest.values.pv_today }} - Verbrauch {{ if .solar.derived.balance.approximate }}≈ {{ end }}{{ energy .solar.derived.balance.consumption }} - Bezug {{ energy .solar.current.latest.values.import_today }} - Einspeisung {{ energy .solar.current.latest.values.export_today }}'
              align: center
        - weight: 20
          block:
            rows:
              padding: 4
              items:
                - label: '{{ if .solar.derived.balance.approximate }}≈ {{ end }}Autarkie'
                  value: solar/derived/balance/autarky
                  format: ratio
