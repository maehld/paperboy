# The glucose page: the current reading next to the day, the numbers of the
# day below. Requires the dexcom plugin (docs/plugins/dexcom.md).
title: Glukose
grid: [6, 8]
style: { padding: 4.5, divider: 0.6 }
cells:
  - { at: [0, 0], span: [6, 1], widget: paperboy/header }
  - { at: [0, 1], span: [2, 3], widget: dexcom/glucose }
  - { at: [2, 1], span: [4, 3], widget: dexcom/graph, args: { period: day } }
  - { at: [0, 4], span: [6, 4], widget: dexcom/values, args: { values: [avg, in_band, min, max, delta, count], columns: 2 } }
