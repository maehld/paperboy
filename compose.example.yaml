# Example: Paperboy as a container.
# Create an instance directory first (ADR 0037) with paperboy.yaml, pages/ and
# plans/, plus plugins/ for your own plugins; Paperboy creates state/ itself.
# Copy the example from cmd/paperboy/paperboy.example.yaml and mount the
# directory at /config. The shipped plugins (calendar, weather, solardemo) are
# in the image. Secrets for plugin configs, e.g. PAPERBOY_CALDAV_PASSWORD, go
# into a .env file and reach paperboy.yaml as ${VAR} (ADR 0049).
services:
  paperboy:
    build: .
    environment:
      PAPERBOY_CALDAV_PASSWORD: ${PAPERBOY_CALDAV_PASSWORD:-}
    ports: ["8090:8090"]
    volumes: ["./paperboy:/config"]
    restart: unless-stopped
    # Read-only configuration: replace the volumes line above with the
    # following, so that only state/ is writable.
    # volumes:
    #   - "./paperboy/paperboy.yaml:/config/paperboy.yaml:ro"
    #   - "./paperboy/pages:/config/pages:ro"
    #   - "./paperboy/plans:/config/plans:ro"
    #   - "./paperboy/plugins:/config/plugins:ro"
    #   - "./paperboy/state:/config/state"
