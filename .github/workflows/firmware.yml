name: Firmware

# Compiles the Paperboy firmware for every hardware type with the pinned
# ESPHome version and bundles the OTA images into one zip that unpacks in the
# instance layout firmware/<hardware>/<hardware>-<version>.bin (ADR 0043, 0059).
# Runs on firmware changes and as the builder for release.yml, which attaches
# the bundle to a release (ADR 0056).

on:
  push:
    branches: [main]
    paths:
      - firmware/esphome/**
      - .github/workflows/firmware.yml
  pull_request:
    branches: [main]
    paths:
      - firmware/esphome/**
      - .github/workflows/firmware.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version in the zip name (default: highest fw_version)"
        required: false
  workflow_call:
    inputs:
      version:
        description: "Version in the zip name (default: highest fw_version)"
        type: string
        required: false

permissions:
  contents: read

env:
  # Keep in step with firmware/esphome/build.ps1.
  ESPHOME_VERSION: "2026.10.1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hardware: [sticky, e1001, lcd2004]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The ESP32 platform and its toolchains dominate the build time and only
      # change with the ESPHome pin above.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-esphome-${{ env.ESPHOME_VERSION }}

      - name: Cache ESPHome packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-esphome-${{ env.ESPHOME_VERSION }}

      - name: Install ESPHome
        run: |
          python3 -m venv "$RUNNER_TEMP/esphome-venv"
          "$RUNNER_TEMP/esphome-venv/bin/pip" install "esphome==${ESPHOME_VERSION}"
          echo "$RUNNER_TEMP/esphome-venv/bin" >> "$GITHUB_PATH"

      - name: Compile
        working-directory: firmware/esphome
        run: esphome compile "${{ matrix.hardware }}.yaml"

      - name: Package
        working-directory: firmware/esphome
        env:
          HARDWARE: ${{ matrix.hardware }}
        run: |
          version=$(grep -m1 -E '^[[:space:]]*fw_version:' "$HARDWARE.yaml" \
            | sed -E 's/.*fw_version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          if [ -z "$version" ]; then
            echo "no fw_version in $HARDWARE.yaml"
            exit 1
          fi
          image=".esphome/build/$HARDWARE/build/firmware.ota.bin"
          if [ ! -f "$image" ]; then
            echo "no OTA image at $image"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$image" "$RUNNER_TEMP/dist/$HARDWARE-$version.bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: firmware-image-${{ matrix.hardware }}
          path: ${{ runner.temp }}/dist/*.bin

  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download images
        uses: actions/download-artifact@v5
        with:
          # The images of this workflow only; release.yml loads paperboy-*.
          pattern: firmware-image-*
          path: images
          merge-multiple: true

      - name: Bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          images=(images/*.bin)
          if [ ${#images[@]} -eq 0 ]; then
            echo "no firmware images downloaded"
            exit 1
          fi
          # v2.1.0 becomes 2.1.0; without a given version the zip is named
          # after the highest fw_version in the bundle (ADR 0059).
          version="${VERSION#v}"
          if [ -z "$version" ]; then
            version=$(for image in "${images[@]}"; do
              basename "$image" | sed -E 's/^.*-([0-9.]+)\.bin$/\1/'
            done | sort -V | tail -n1)
          fi
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/firmware"
          for image in "${images[@]}"; do
            name=$(basename "$image")
            hardware="${name%%-*}"
            mkdir -p "$stage/firmware/$hardware"
            cp "$image" "$stage/firmware/$hardware/$name"
          done
          mkdir -p "$RUNNER_TEMP/dist"
          (cd "$stage" && zip -qr "$RUNNER_TEMP/dist/paperboy-firmware-$version.zip" firmware)
          unzip -l "$RUNNER_TEMP/dist/paperboy-firmware-$version.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: paperboy-firmware-bundle
          path: ${{ runner.temp }}/dist/*.zip
