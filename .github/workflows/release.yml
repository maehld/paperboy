name: Release

# Builds the artifacts for a release and attaches them to one GitHub release
# (ADR 0147). A tag starts a release:
#
#   server-v3.30.0             the server binaries
#   plugins-2026.11.21         the plugin zips (date of the release)
#   firmware-2026.11.21        the firmware bundle (date of the release)
#
# The Actions UI starts a release too (ADR 0150). Choose the train and the
# version; the workflow tags the selected commit and creates the release after
# the build. A second release of a train on the same day appends .1, .2, ...
# A suffix -rc.1 or -beta.1 marks a prerelease. One tag is one release; several
# tags may point to the same commit.

on:
  push:
    tags:
      - "server-v*"
      - "plugins-*"
      - "firmware-*"
  workflow_dispatch:
    inputs:
      train:
        description: Release train
        required: true
        type: choice
        options: [server, plugins, firmware]
      version:
        description: "Server: X.Y.Z; plugins/firmware: YYYY.MM.DD[.N]; empty: today (UTC)"
        required: false
        type: string

permissions:
  contents: write

# One release at a time, so two dispatches cannot create the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      train: ${{ steps.tag.outputs.train }}
      version: ${{ steps.tag.outputs.version }}
      minor: ${{ steps.tag.outputs.minor }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TRAIN: ${{ inputs.train }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ]; then
            train="$INPUT_TRAIN"
            version="$INPUT_VERSION"
            if [ -z "$version" ] && [ "$train" != server ]; then
              version=$(date -u +%Y.%m.%d)
            fi
            if [ "$train" = server ] && [ -z "$version" ]; then
              echo "the server release needs a version" >&2
              exit 1
            fi
            case "$train" in
              server)   version="${version#v}"; tag="server-v$version" ;;
              plugins)  tag="plugins-$version" ;;
              firmware) tag="firmware-$version" ;;
              *)        echo "unknown release train: $train" >&2; exit 1 ;;
            esac
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "tag $tag already exists; use a new version" >&2
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            case "$tag" in
              server-v*)  train=server; version="${tag#server-v}" ;;
              plugins-*)  train=plugins; version="${tag#plugins-}" ;;
              firmware-*) train=firmware; version="${tag#firmware-}" ;;
              *)          echo "unknown release tag: $tag" >&2; exit 1 ;;
            esac
          fi
          ./scripts/check-release-tag.sh "$tag"
          case "$version" in
            *-*) prerelease=true; minor="" ;;
            *)   prerelease=false; minor="${version%.*}" ;;
          esac
          {
            echo "tag=$tag"
            echo "train=$train"
            echo "version=$version"
            echo "minor=$minor"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  server:
    needs: prepare
    if: needs.prepare.outputs.train == 'server'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version label comes from Go's VCS stamping, which needs history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: Build
        run: |
          ext=""
          [ "${{ matrix.os }}" = windows ] && ext=".exe"
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath \
            -ldflags="-s -w -X github.com/maehld/paperboy/server/internal/paperboy.version=v${version}" \
            -o "dist/paperboy-${{ matrix.os }}-${{ matrix.arch }}$ext" ./server/cmd/paperboy

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: paperboy-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/paperboy-${{ matrix.os }}-${{ matrix.arch }}*

  docker:
    needs: prepare
    if: needs.prepare.outputs.train == 'server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # The full version of the server release (3.30.0, 3.31.0-rc.1).
            type=raw,value=${{ needs.prepare.outputs.version }}
            # The moving X.Y tag stays with the last final release (ADR 0089).
            type=raw,value=${{ needs.prepare.outputs.minor }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=v${{ needs.prepare.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plugins:
    needs: prepare
    if: needs.prepare.outputs.train == 'plugins'
    uses: ./.github/workflows/plugins.yml

  firmware:
    needs: prepare
    if: needs.prepare.outputs.train == 'firmware'
    uses: ./.github/workflows/firmware.yml

  release:
    needs: [prepare, server, docker, plugins, firmware]
    # Skipped jobs are fine, a failed build must not publish a partial release.
    if: >
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.server.result != 'failure' &&
      needs.docker.result != 'failure' &&
      needs.plugins.result != 'failure' &&
      needs.firmware.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          # The images the firmware bundle is built from stay internal.
          pattern: paperboy-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      # The generated notes compare against the last stable release of the same
      # train. Without this the API picks any reachable tag, so a server release
      # could diff against plugins-* or firmware-*.
      - name: Previous release of the train
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TRAIN: ${{ needs.prepare.outputs.train }}
        run: |
          case "$TRAIN" in
            server)   prefix='server-v' ;;
            plugins)  prefix='plugins-' ;;
            firmware) prefix='firmware-' ;;
          esac
          # Releases come newest first, so the first stable one of the train is
          # the previous release. Drafts are invisible to a download anyway.
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name')
          previous=''
          while read -r tag; do
            [ "$tag" = "$TAG" ] && continue
            case "$tag" in
              "$prefix"*) version="${tag#"$prefix"}" ;;
              *)          continue ;;
            esac
            # A version with a suffix is a prerelease, not a base for notes.
            case "$version" in
              *-*) continue ;;
            esac
            previous="$tag"
            break
          done <<< "$tags"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
          echo "previous release of the train: ${previous:-none}"

      # A plugin or firmware release names the versions inside it, so the
      # operator sees what the date label contains (ADR 0147).
      - name: Describe the release
        id: body
        if: needs.prepare.outputs.train != 'server'
        env:
          TRAIN: ${{ needs.prepare.outputs.train }}
        run: |
          case "$TRAIN" in
            plugins)
              {
                echo "## Plugins"
                echo
                for file in plugins/cmd/*/VERSION; do
                  name=$(basename "$(dirname "$file")")
                  echo "- \`$name-v$(tr -d '[:space:]' < "$file")\`"
                done
                echo
                echo "Unpack \`paperboy-plugins-<os>-<arch>.zip\` in the instance directory. It creates \`plugins/\`."
              } > "$RUNNER_TEMP/body.md"
              ;;
            firmware)
              {
                echo "## Firmware"
                echo
                for file in firmware/esphome/*.yaml; do
                  hardware=$(basename "$file" .yaml)
                  case "$hardware" in common | text-common) continue ;; esac
                  version=$(grep -m1 -E '^[[:space:]]*fw_version:' "$file" |
                    sed -E 's/.*fw_version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
                  if [ -n "$version" ]; then
                    echo "- \`$hardware-v$version.bin\`"
                  fi
                done
                echo
                echo "Unpack \`paperboy-firmware.zip\` in the instance directory. It creates \`firmware/\`."
              } > "$RUNNER_TEMP/body.md"
              ;;
          esac
          echo "path=$RUNNER_TEMP/body.md" >> "$GITHUB_OUTPUT"

      # The newest final server release carries GitHub's "Latest" badge. A
      # prerelease and a plugin or firmware release do not claim it (ADR 0149).
      - name: Release with generated notes
        if: needs.prepare.outputs.train == 'server'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Container image
            The primary server artifact is the container image:
            `ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}`
            ${{ needs.prepare.outputs.prerelease == 'false' && format('Also tagged `:{0}` and `:latest`.', needs.prepare.outputs.minor) || 'A prerelease, not tagged `latest`.' }}
            The binaries are attached as secondary assets.
          generate_release_notes: true
          previous_tag: ${{ steps.previous.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'false' }}
          files: dist/*

      - name: Release with asset notes
        if: needs.prepare.outputs.train != 'server'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.body.outputs.path }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: false
          files: dist/*
