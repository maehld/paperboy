name: Release

# Builds the artifacts for a tag and attaches them to one GitHub release
# (ADR 0056). The tag prefix selects the release train:
#
#   v2.1.0          Paperboy, plugins and firmware
#   plugins-v2.1.0  plugins only
#   firmware-v1.0.0 firmware bundle only (bundle version: highest fw_version)

on:
  push:
    tags:
      - "v*"
      - "plugins-v*"
      - "firmware-v*"

permissions:
  contents: write

jobs:
  paperboy:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version label comes from Go's VCS stamping, which needs the tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          ext=""
          [ "${{ matrix.os }}" = windows ] && ext=".exe"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath \
            -ldflags="-s -w -X github.com/maehld/paperboy/internal/paperboy.version=${GITHUB_REF_NAME}" \
            -o "dist/paperboy-${{ matrix.os }}-${{ matrix.arch }}$ext" ./cmd/paperboy

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: paperboy-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/paperboy-${{ matrix.os }}-${{ matrix.arch }}*

  plugins:
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'plugins-v')
    uses: ./.github/workflows/plugins.yml

  firmware:
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'firmware-v')
    uses: ./.github/workflows/firmware.yml

  release:
    needs: [paperboy, plugins, firmware]
    # Skipped jobs are fine, a failed build must not publish a partial release.
    if: >
      always() && !cancelled() &&
      needs.paperboy.result != 'failure' &&
      needs.plugins.result != 'failure' &&
      needs.firmware.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          # The images the firmware bundle is built from stay internal.
          pattern: paperboy-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      # A tag whose version carries a suffix (v1.4.0-rc.1, plugins-v1.4.0-rc.1)
      # marks a prerelease delivery, which only the latest channel installs
      # (ADR 0089). The train prefix has a hyphen too, so only the part after the
      # last v is asked.
      - name: Prerelease tag
        id: tag
        run: |
          version="${GITHUB_REF_NAME##*v}"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Release with generated notes
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: dist/*

      - name: Release with asset notes
        if: "!startsWith(github.ref_name, 'v')"
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.tag.outputs.prerelease }}
          body: |
            Release of a single release train (ADR 0056).

            - `paperboy-plugins-<os>-<arch>.zip`: unpack in the instance directory, creates `plugins/`.
            - `paperboy-firmware.zip`: unpack in the instance directory, creates `firmware/<hardware>-v<version>.bin` for every hardware type (ADR 0043, 0059, 0060, 0063).
            - `SHA256SUMS`: checksums of all assets.
          files: dist/*
