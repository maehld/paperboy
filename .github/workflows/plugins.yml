name: Plugins

# Builds the shipped plugins as one zip per platform. Unpacked in the instance
# directory, a zip creates plugins/ with the binaries (ADR 0049). Tags attach
# the zips to the GitHub release; other runs keep them as workflow artifacts.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, windows/amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build and zip
        id: zip
        run: |
          GOOS=${TARGET%/*} GOARCH=${TARGET#*/} ./scripts/package-plugins.sh dist
          echo "name=paperboy-plugins-${TARGET%/*}-${TARGET#*/}" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/${{ steps.zip.outputs.name }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.zip.outputs.name }}.zip
