name: Plugins

# Builds the shipped plugins as one zip per platform (ADR 0049). Unpacked in
# the instance directory, a zip creates plugins/ with the binaries. Runs on
# changes and as the builder for release.yml, which attaches the zips to a
# release (ADR 0056). On a pull request it also checks that a changed plugin
# raised its version (ADR 0075).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The check compares against the base branch.
          fetch-depth: 0

      - name: Check plugin versions
        run: ./scripts/check-plugin-versions.sh "origin/${{ github.base_ref }}"

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, windows/amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build and zip
        id: zip
        run: |
          GOOS=${TARGET%/*} GOARCH=${TARGET#*/} ./scripts/package-plugins.sh dist
          echo "name=paperboy-plugins-${TARGET%/*}-${TARGET#*/}" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/${{ steps.zip.outputs.name }}.zip
