# Shared part of the Paperboy firmware (ADR 0041), included as a package by
# the hardware files. The hardware file supplies the pins, the display (id
# epaper_display), the read_battery script (sets pb_bat_* in paperboy.h), the
# deep_sleep component (id sleeper), the wake decoding and the button roles.
#
# Nothing installation-specific is compiled in:
# - Wi-Fi comes from the captive portal (hotspot paperboy-<id>) or Improv.
# - The Paperboy URL is entered in the device's web UI and kept in flash.
# - The device key comes from POST /api/device/register by MAC and is kept in
#   flash; a 401 drops it and the device registers again.
# While something is missing the device shows instructions and stays awake for
# up to 10 minutes. After power-on it stays awake 3 minutes for changes.
#
# Cycle (ADR 0042): wake -> (register) -> POST /api/device/sync with reason,
# events, shown hash, battery, RSSI and log -> flash and reboot if the sync
# offers firmware (ADR 0043) -> download and paint only if the hash changed ->
# stay awake listen_s for further input -> deep sleep for refresh_s. Presses made while a sync or paint is running are queued and sent
# together in the next sync, so Paperboy renders only the final page.
# Mains-powered devices (sleep: false in the sync, ADR 0051) skip the deep
# sleep: they stay awake and sync again after refresh_s. The hardware file
# sets pb_power so Paperboy learns the power source.

esphome:
  # Network name paperboy-<last three MAC bytes>; the build directory is per
  # hardware type.
  name: paperboy
  name_add_mac_suffix: true
  build_path: build/${hardware}   # relative to .esphome/
  includes:
    - paperboy.h
  project:
    name: paperboy.${hardware}
    version: ${fw_version}
  on_boot:
    - priority: -100
      then:
        - lambda: "pb_init_rtc();"
        - lambda: "pb_time(\"boot\");"
        - lambda: "id(mac) = get_mac_address_pretty();"
        # A cold boot shows the mark for 5 s (ADR 0095). A timer or button wake
        # goes straight to its page, so a page change stays as fast as it is.
        # Wi-Fi connects meanwhile, so the splash rarely costs anything.
        - if:
            condition:
              lambda: 'return id(wake_reason) == "powercycle";'
            then:
              - script.execute: boot_splash
              - script.wait: boot_splash
        - if:
            condition:
              lambda: "return !wifi::global_wifi_component->has_sta();"
            then:
              - script.execute: { id: enter_setup, reason: "wifi" }
              - wait_until:
                  condition: wifi.connected
        - wait_until:
            condition: wifi.connected
            timeout: 20s
        - if:
            condition: wifi.connected
            then:
              - script.execute: run_cycle
            else:
              - lambda: 'pb_note_for_next_wake("no Wi-Fi connection");'
              - logger.log: "no Wi-Fi, sleeping"
              - script.execute: go_sleep

wifi:
  # No networks compiled in: they come from the captive portal or Improv.
  power_save_mode: light
  # Connect to the saved BSSID and channel without scanning first: the scan
  # before every wake cost 4.0-4.5 s on the Sticky (measured 2026-11-08).
  # If the saved access point is gone, ESPHome falls back to a scan.
  fast_connect: true
  ap: {}   # SSID: the node name, paperboy-<id>

captive_portal:

improv_serial:

web_server:
  port: 80

ota:
  # The only network update path: images offered by Paperboy in the sync
  # (ADR 0043). ESPHome checks the MD5 and rolls back an image that does not
  # boot. There is no native ESPHome OTA and no web UI upload, so the build
  # needs no secrets; anything else goes over USB.
  - platform: http_request

text:
  - platform: template
    id: paperboy_url
    name: "Paperboy URL"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${default_paperboy_url}"
    max_length: 120
    # Saving a new URL starts the cycle at once. Otherwise a device that sits
    # in setup waits for its next wake, and a corrected URL would take up to an
    # hour to be used.
    # The value is also published when flash restores it at boot, where on_boot
    # already starts the cycle, so only a change while everything is ready may
    # start one (see run_cycle for what a second cycle costs).
    on_value:
      - lambda: |-
          std::string url = pb_base(x);
          if (!url.empty() && wifi::global_wifi_component->is_connected() && !id(busy)) {
            ESP_LOGI("paperboy", "Paperboy URL set to %s, starting the cycle", url.c_str());
          }
      - if:
          condition:
            lambda: |-
              return !pb_base(id(paperboy_url).state).empty() &&
                     wifi::global_wifi_component->is_connected() && !id(busy);
          then:
            - script.execute: run_cycle
  - platform: template
    id: api_key
    internal: true
    mode: password
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 64

font:
  - file: "gfonts://Inter@500"
    id: setup_font
    size: 28

globals:
  - id: wake_reason
    type: std::string
    initial_value: '"powercycle"'
  - id: setup_mode
    type: bool
    initial_value: "false"
  - id: setup_text
    type: std::string
    initial_value: '""'
  - id: mac
    type: std::string
    initial_value: '""'
  # Header lambdas return const char*, so the header value lives in a global.
  - id: auth_header
    type: std::string
    initial_value: '""'
  - id: image_path
    type: std::string
    initial_value: '""'
  - id: image_hash
    type: std::string
    initial_value: '""'
  - id: listen_s
    type: int
    initial_value: "0"
  # sleep: false in the last sync (ADR 0051): the device is on mains, stays
  # awake and syncs again after refresh_s instead of deep sleeping.
  - id: stay_awake
    type: bool
    initial_value: "false"
  # Firmware offer from the last sync; empty path = no offer.
  - id: fw_path
    type: std::string
    initial_value: '""'
  - id: fw_md5
    type: std::string
    initial_value: '""'
  - id: fw_offered
    type: std::string
    initial_value: '""'
  # Result of the last sync: 0 = failed, 1 = ok, 2 = key rejected.
  - id: sync_result
    type: int
    initial_value: "0"
  # True while a sync, download or paint runs; input is queued meanwhile.
  - id: busy
    type: bool
    initial_value: "false"
  # Sync attempts of this wake with their own retry (ADR 0064).
  - id: sync_attempts
    type: int
    initial_value: "0"
  # Registration attempts of this wake.
  - id: reg_attempts
    type: int
    initial_value: "0"
  # Button that woke the device: its role and GPIO for the press measurement
  # (ADR 0067). Empty role = no button wake.
  - id: wake_role
    type: std::string
    initial_value: '""'
  - id: wake_gpio
    type: int
    initial_value: "0"

http_request:
  useragent: paperboy-esphome
  timeout: 15s
  verify_ssl: false
  # The image download reads one client buffer per loop iteration, and every
  # read waits for the radio: 512 bytes took as long as 2048 for a page, so
  # this only keeps the number of reads down (measured 2026-11-08).
  buffer_size_rx: 2048

# No online_image: its decoders spend about 2.2-2.6 s on the 384k pixels of a
# page (measured 2026-11-08), whatever the format and file size. The firmware
# fetches the QOI bytes and paints them itself (ADR 0072), which removes both
# the decode cost and the 384 KB image buffer.

script:
  # ---------------------------------------------------------------- cycle

  # The splash of a power-on (ADR 0095): the mark in the middle of the panel for
  # 5 s. The page hash is dropped first, because the panel shows the splash, not
  # the page - after a firmware update the RTC memory survives the reboot, so an
  # "unchanged" answer must not leave the splash on the panel.
  - id: boot_splash
    mode: single
    then:
      - lambda: |-
          pb_splash = true;
          pb_shown_hash[0] = 0;
      - component.update: epaper_display
      - delay: 100ms
      - script.execute: wait_paint
      - script.wait: wait_paint
      - lambda: 'pb_time("splash");'
      - delay: 5s
      - lambda: "pb_splash = false;"

  - id: run_cycle
    mode: restart
    then:
      - if:
          condition:
            lambda: "return pb_base(id(paperboy_url).state).empty();"
          then:
            - script.execute: { id: enter_setup, reason: "url" }
            - wait_until:
                condition:
                  lambda: "return !pb_base(id(paperboy_url).state).empty();"
      - lambda: "id(setup_mode) = false;"
      - script.stop: setup_limit
      - script.execute: awake_limit
      # A one-shot wake reason from the last sync (menu, result) wins over the
      # wake the hardware decoded (ADR 0064).
      - lambda: "id(wake_reason) = pb_take_reason(id(wake_reason));"
      # After deep sleep and in the awake loop the radio needs a few seconds.
      # A request before that fails as "not connected" and used to send the
      # device straight back to sleep.
      - wait_until:
          condition: wifi.connected
          timeout: 45s
      - lambda: |-
          if (wifi::global_wifi_component->is_connected()) {
            pb_time("wifi");
          }
      - if:
          condition:
            lambda: "return wifi::global_wifi_component->is_connected();"
          then:
            - if:
                condition:
                  lambda: "return id(api_key).state.empty();"
                then:
                  - script.execute: do_register
                  - script.wait: do_register
            - if:
                condition:
                  lambda: "return !id(api_key).state.empty();"
                then:
                  # One cycle at a time. A second sync while the first answer is
                  # still downloading does move Paperboy's cursor (with `rotate`
                  # in the plan) while the panel keeps the old page, so the
                  # second page would never be seen: drop the extra cycle and
                  # leave the running one to deliver its page.
                  - if:
                      condition:
                        lambda: "return id(busy);"
                      then:
                        - logger.log: "a cycle is already running, keeping its page"
                      else:
                        - script.execute: sync_and_show
                else:
                  - if:
                      condition:
                        lambda: "return !id(setup_mode);"
                      then:
                        # No key and no server: show the setup screen with the
                        # address instead of sleeping, so a wrong Paperboy URL
                        # can be corrected right away.
                        - script.execute: { id: enter_setup, reason: "url" }
          else:
            - lambda: 'pb_note_for_next_wake("no Wi-Fi connection");'
            - logger.log: "no Wi-Fi, sleeping"
            - script.execute: go_sleep

  # Called by the buttons with their role (next, previous, home), the GPIO they
  # read and their press time. The event carries the measured press duration;
  # the server decides what counts as a long press (ADR 0067), so a press is
  # queued when the button is released or after the hold timeout and a sync
  # starts at once unless one is already running.
  - id: button_pressed
    mode: queued
    parameters:
      role: string
      gpio: int
      start: int
    then:
      - if:
          condition:
            lambda: "return !id(setup_mode) && !id(api_key).state.empty();"
          then:
            - wait_until:
                condition:
                  lambda: "return gpio_get_level((gpio_num_t) gpio) != 0;"
                timeout: 700ms
            - lambda: |-
                uint32_t ms = esphome::millis() - (uint32_t) start;
                if (ms > 60000) ms = 60000;
                pb_button(role, ms);
                pb_time("button");
                id(wake_reason) = "button";
            - script.execute: awake_limit
            - if:
                condition:
                  lambda: "return !id(busy);"
                then:
                  - script.execute: sync_and_show

  # Touches carry no meaning yet; Paperboy logs them (ADR 0042).
  - id: touched
    mode: queued
    parameters:
      x: int
      y: int
    then:
      - if:
          condition:
            lambda: "return !id(setup_mode) && !id(api_key).state.empty();"
          then:
            - lambda: |-
                pb_touch(x, y);
                if (id(wake_reason) != "button") id(wake_reason) = "touch";
            - script.execute: awake_limit
            - if:
                condition:
                  lambda: "return !id(busy);"
                then:
                  - script.execute: sync_and_show

  # ---------------------------------------------------------------- setup

  - id: enter_setup
    mode: restart
    parameters:
      reason: string
    then:
      - lambda: |-
          id(setup_mode) = true;
          std::string t = "Paperboy setup\n";
          if (reason == "wifi") {
            t += "1. Join the Wi-Fi \"" + App.get_name() + "\"\n";
            t += "   and choose your network.\n";
            t += "2. Then open this device's address\n";
            t += "   and enter the Paperboy URL.\n";
          } else if (reason == "url") {
            auto ips = wifi::global_wifi_component->get_ip_addresses();
            char ip[48] = "?";
            if (ips[0].is_set()) {
              ips[0].str_to(ip);
            }
            t += "Open http://" + std::string(ip) + "/\n";
            t += "and enter the Paperboy URL.\n";
            std::string current = pb_base(id(paperboy_url).state);
            if (!current.empty()) {
              t += "Now: " + current + "\n";
            }
          } else {
            t += "Paperboy does not know this display.\n";
            t += "Add its MAC to paperboy.yaml.\n";
          }
          t += "MAC " + id(mac);
          id(setup_text) = t;
          ESP_LOGW("paperboy", "setup needed: %s", reason.c_str());
      - script.stop: awake_limit
      - script.execute: setup_limit
      - component.update: epaper_display

  # ---------------------------------------------------------------- device API

  # POST /api/device/register trades the MAC for the device key; 403 means
  # the MAC is not in paperboy.yaml. A request that fails as a whole is
  # retried, and an unreachable or wrong Paperboy URL ends in the setup screen
  # instead of a silent deep sleep, so the operator can correct it.
  - id: do_register
    mode: single
    then:
      - lambda: "id(reg_attempts) = 0;"
      - while:
          condition:
            lambda: "return id(api_key).state.empty() && id(reg_attempts) < 3;"
          then:
            - lambda: "id(reg_attempts)++;"
            - script.execute: do_register_once
            - script.wait: do_register_once
            - if:
                condition:
                  lambda: "return id(api_key).state.empty();"
                then:
                  - delay: 2s

  - id: do_register_once
    mode: single
    then:
      - http_request.post:
          url: !lambda 'return pb_base(id(paperboy_url).state) + "/api/device/register";'
          capture_response: true
          max_response_buffer_size: 512
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            return "{\"mac\":" + pb_json_string(id(mac)) +
                   ",\"hardware\":\"${hardware}\",\"firmware\":\"${fw_version}\"}";
          on_response:
            then:
              - lambda: |-
                  std::string key;
                  if (response->status_code == 200) {
                    json::parse_json(body, [&](JsonObject root) -> bool {
                      key = root["key"] | "";
                      return true;
                    });
                  }
                  if (!key.empty()) {
                    id(api_key).make_call().set_value(key).perform();
                    ESP_LOGI("paperboy", "registered with Paperboy");
                  } else {
                    ESP_LOGW("paperboy", "registration refused: HTTP %d", response->status_code);
                  }
              - if:
                  condition:
                    lambda: "return response->status_code == 403;"
                  then:
                    - script.execute: { id: enter_setup, reason: "unknown" }
          on_error:
            then:
              - lambda: 'pb_note_for_next_wake("registration request failed");'
              - logger.log: "registration request failed"

  # One POST /api/device/sync per attempt; the outcome is left in sync_result.
  # A failed request keeps the event queue and retries (ADR 0064).
  - id: do_sync
    mode: single
    then:
      - lambda: "id(sync_attempts) = 0;"
      - while:
          condition:
            lambda: "return id(sync_result) != 1 && id(sync_attempts) < 3;"
          then:
            - lambda: "id(sync_attempts)++;"
            - script.execute: do_sync_once
            - script.wait: do_sync_once
            - if:
                condition:
                  lambda: "return id(sync_result) != 1;"
                then:
                  - delay: 2s

  - id: do_sync_once
    mode: single
    then:
      - script.execute: read_battery
      - script.wait: read_battery
      - lambda: |-
          id(sync_result) = 0;
          id(auth_header) = "Bearer " + id(api_key).state;
      - http_request.post:
          url: !lambda 'return pb_base(id(paperboy_url).state) + "/api/device/sync";'
          capture_response: true
          max_response_buffer_size: 1024
          request_headers:
            Content-Type: application/json
            Authorization: !lambda "return id(auth_header).c_str();"
          body: !lambda |-
            return pb_sync_body("${fw_version}", "${hardware}", id(wake_reason),
                                (int) wifi::global_wifi_component->wifi_rssi());
          on_response:
            then:
              - lambda: |-
                  int status = response->status_code;
                  if (status == 401) {
                    ESP_LOGW("paperboy", "key rejected, registering again");
                    id(api_key).make_call().set_value("").perform();
                    id(sync_result) = 2;
                    return;
                  }
                  if (status != 200) {
                    ESP_LOGW("paperboy", "sync: HTTP %d", status);
                    pb_note_for_next_wake(str_sprintf("sync answered HTTP %d", status));
                    return;
                  }
                  bool ok = json::parse_json(body, [&](JsonObject root) -> bool {
                    id(image_path) = root["image"]["path"] | "";
                    id(image_hash) = root["image"]["hash"] | "";
                    int refresh = root["refresh_s"] | 600;
                    pb_refresh_s = refresh > 0 ? refresh : 600;
                    id(listen_s) = root["listen_s"] | 0;
                    // Older servers send no sleep field: keep deep sleeping.
                    id(stay_awake) = !(root["sleep"] | true);
                    id(fw_offered) = root["firmware"]["version"] | "";
                    id(fw_path) = root["firmware"]["path"] | "";
                    id(fw_md5) = root["firmware"]["md5"] | "";
                    // A one-shot wake reason (menu, result) overrides the next
                    // sleep (ADR 0064).
                    std::string wake = root["wake"]["reason"] | "";
                    int after = root["wake"]["after_s"] | 0;
                    if (!wake.empty() && after > 0) {
                      pb_set_wake(wake, (uint32_t) after);
                    } else {
                      pb_next_reason[0] = 0;
                      pb_next_s = 0;
                    }
                    return true;
                  });
                  if (ok) {
                    pb_sync_done();
                  }
                  if (ok && !id(image_path).empty()) {
                    id(sync_result) = 1;
                  }
                  ESP_LOGI("paperboy", "image %s, refresh %d s, listen %d s, sleep %s", id(image_path).c_str(),
                           pb_refresh_s, id(listen_s), id(stay_awake) ? "no" : "yes");
          on_error:
            then:
              - lambda: 'pb_note_for_next_wake("sync request failed");'
              - logger.log: "sync request failed"

  # Sync, register again after a 401, then paint the answer if it changed.
  - id: sync_and_show
    mode: single
    then:
      - script.stop: after_paint
      - lambda: |-
          // Never judge "unchanged" from a stale answer: if the request does
          // not run, sync_result stays 0 and the cycle fails instead of
          // repainting the same page in a loop.
          id(busy) = true;
          id(sync_result) = 0;
          id(image_path) = "";
          id(image_hash) = "";
      - script.stop: do_sync
      - script.stop: do_sync_once
      - script.execute: do_sync
      - script.wait: do_sync
      - if:
          condition:
            lambda: "return id(sync_result) == 2;"
          then:
            - script.execute: do_register
            - script.wait: do_register
            - if:
                condition:
                  lambda: "return !id(api_key).state.empty();"
                then:
                  - script.execute: do_sync
                  - script.wait: do_sync
      - lambda: "pb_time(\"sync\");"
      - if:
          condition:
            lambda: "return id(sync_result) != 1;"
          then:
            - if:
                condition:
                  lambda: "return !id(setup_mode);"
                then:
                  - script.execute: go_sleep
          else:
            - if:
                condition:
                  lambda: "return !id(fw_path).empty() && !id(fw_md5).empty();"
                then:
                  # Paperboy decided (battery, hold, failures); the device
                  # flashes and reboots, and the next sync reports the result.
                  - script.stop: awake_limit
                  - lambda: |-
                      ESP_LOGI("paperboy", "firmware update ${fw_version} -> %s", id(fw_offered).c_str());
                  - ota.http_request.flash:
                      url: !lambda "return pb_base(id(paperboy_url).state) + id(fw_path);"
                      md5: !lambda "return id(fw_md5);"
                  - lambda: |-
                      pb_note_for_next_wake("firmware update to " + id(fw_offered) + " failed");
                      id(fw_path) = "";
                  - script.execute: awake_limit
            - if:
                condition:
                  lambda: "return pb_unchanged(id(image_hash));"
                then:
                  - logger.log: "content unchanged, not repainting"
                  - lambda: "pb_time(\"unchanged\");"
                  - script.execute: after_paint
                else:
                  - script.execute: fetch_page
                  - script.wait: fetch_page

  # Fetches the page as QOI (ADR 0072) and repaints the panel with it. The
  # display lambda decodes it straight into the panel buffer, which is what
  # makes a page change short. The buffer is 512 KiB in PSRAM (the chips have
  # 8 MB): a four-level 800x480 page costs at most one QOI byte per pixel, so
  # every page fits with room to spare, and Paperboy keeps its own limit in
  # step (ADR 0088). The response is moved into pb_page_qoi instead of copied,
  # which keeps the peak at twice the buffer.
  - id: fetch_page
    mode: single
    then:
      - http_request.get:
          url: !lambda "return pb_base(id(paperboy_url).state) + id(image_path) + \"?format=qoi\";"
          capture_response: true
          max_response_buffer_size: 524288
          on_response:
            then:
              - lambda: |-
                  pb_page_qoi = std::move(body);
                  pb_time("image");
              # The hash is stored after the paint (after_paint), and the
              # lambda sets paint_pending only when the decode worked, so a
              # sync that reports "shown" proves the panel really shows it.
              - component.update: epaper_display
              - script.execute: after_paint
          on_error:
            then:
              - lambda: 'pb_note_for_next_wake("image download failed: " + id(image_path));'
              - logger.log: "image download failed"
              - script.execute: go_sleep

  # ---------------------------------------------------------------- sleep

  # Waits for the panel, sends input that arrived meanwhile, and otherwise
  # stays awake as long as Paperboy asked (listen_s); after power-on long
  # enough to change settings in the web UI.
  - id: after_paint
    mode: restart
    then:
      - delay: 100ms
      # Every hardware type provides wait_paint: the Sticky's panel paints
      # asynchronously, the E1001's driver blocks until it is idle.
      - script.execute: wait_paint
      - script.wait: wait_paint
      - lambda: "pb_time(\"paint\");"
      - lambda: |-
          // The panel painted the new image: only now does the shown hash
          // describe what the display really shows (ADR 0064).
          if (pb_paint_pending) {
            pb_remember(id(image_hash));
            pb_paint_pending = false;
          }
          id(busy) = false;
      - if:
          condition:
            lambda: "return pb_has_events();"
          then:
            # Every press that arrived during the paint is already queued. A
            # short settle turns a burst of presses into one sync with all of
            # them instead of two cycles, which is what made the menu lag
            # behind the finger (issue #136).
            - delay: 150ms
            - script.execute: sync_and_show
          else:
            - if:
                condition:
                  lambda: 'return id(wake_reason) == "powercycle";'
                then:
                  - script.stop: awake_limit
                  - delay: 180s
                else:
                  - delay: !lambda "return (uint32_t) std::max(0, id(listen_s)) * 1000;"
            - script.execute: go_sleep

  # Battery devices deep sleep for refresh_s. Mains devices (sleep: false in
  # the sync, ADR 0051) stay awake with Wi-Fi up, wait refresh_s and sync
  # again as a timer wake; input meanwhile syncs at once and restarts the wait.
  - id: go_sleep
    mode: restart
    then:
      # A cycle that ends here was often abandoned midway; without this the
      # busy flag stayed set and every later button press only queued an event
      # that nobody sent.
      - lambda: "id(busy) = false;"
      - if:
          condition:
            lambda: "return id(stay_awake) && !id(setup_mode);"
          then:
            - script.stop: awake_limit
            - delay: !lambda "return pb_sleep_seconds() * 1000;"
            - lambda: 'id(wake_reason) = pb_take_reason("timer");'
            - script.execute: run_cycle
          else:
            - deep_sleep.enter:
                id: sleeper
                sleep_duration: !lambda "return pb_sleep_seconds() * 1000;"

  # Never stay awake longer than this after the last input, whatever hangs.
  - id: awake_limit
    mode: restart
    then:
      - delay: 120s
      - logger.log: "awake limit: forcing deep sleep"
      - lambda: "id(busy) = false;"
      - script.execute: go_sleep

  # Setup waits for the operator, but not forever: retry in an hour.
  - id: setup_limit
    then:
      - delay: 10min
      - logger.log: "setup not finished, sleeping for an hour"
      - lambda: "pb_refresh_s = 3600;"
      - script.execute: go_sleep
