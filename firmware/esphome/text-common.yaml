# Shared part of the Paperboy firmware for text displays (ADR 0041, ADR 0044),
# included as a package by the hardware files. The hardware file supplies the
# board, the display (id text_display) whose lambda prints pb_row, the
# substitution text_columns (the character width of a row) and the beep and
# blink scripts, because the device decides what it can do (ADR 0131). A sync answer names
# the scrolling boxes, their direction, step and whether their text changed
# (ADR 0117); text_scroll moves them without blocking Wi-Fi or OTA.
#
# Text displays run on mains power and never sleep (ADR 0044, ADR 0045,
# ADR 0051); every sync reports power: mains, and the sleep field of the
# answer is ignored because there is no deep sleep path:
# - boot -> register (retried once a minute) -> POST /api/device/sync, again
#   every refresh_s but at most once a minute;
# - GET /api/device/text?shown=<hash> every refresh_s, which the plan decides
#   (one minute until the first sync); unchanged text is a 204;
# - a firmware offer in the sync (ADR 0043) is flashed at once.
#
# Nothing installation-specific is compiled in: Wi-Fi comes from the captive
# portal (hotspot paperboy-<id>) or Improv, the Paperboy URL from the web UI,
# the device key from POST /api/device/register by MAC (dropped on a 401).

esphome:
  name: paperboy
  name_add_mac_suffix: true
  build_path: build/${hardware}   # relative to .esphome/
  includes:
    - paperboy.h
  project:
    name: paperboy.${hardware}
    version: ${fw_version}
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            pb_init_rtc();
            pb_stop_sntp_if_clocked();
            id(mac) = get_mac_address_pretty();
            pb_power = "mains";  // text displays have no battery (ADR 0051)
            pb_show_message("Paperboy\nstarting ...");
        - component.update: text_display

wifi:
  # No networks compiled in: they come from the captive portal or Improv.
  ap: {}   # SSID: the node name, paperboy-<id>
  on_disconnect:
    - lambda: 'pb_note_for_next_wake("Wi-Fi connection lost");'

captive_portal:

# Text displays have no deep sleep that would flush pending preferences, and
# they lose power by being unplugged. ESPHome batches flash writes for a
# minute by default, so a Paperboy URL entered shortly before a restart was
# lost. The values change rarely, so write them at once.
preferences:
  flash_write_interval: 0s

improv_serial:

web_server:
  port: 80

ota:
  # Only images offered by Paperboy in the sync (ADR 0043); no native ESPHome
  # OTA and no web UI upload, so the build needs no secrets.
  - platform: http_request

text:
  - platform: template
    id: paperboy_url
    name: "Paperboy URL"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${default_paperboy_url}"
    max_length: 120
  - platform: template
    id: api_key
    internal: true
    mode: password
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 64

globals:
  - id: mac
    type: std::string
    initial_value: '""'
  # Header lambdas return const char*, so the header value lives in a global.
  - id: auth_header
    type: std::string
    initial_value: '""'
  - id: wake_reason
    type: std::string
    initial_value: '"powercycle"'
  # Uptime in ms when the next register, sync or text poll is due; 0 = at once.
  - id: next_register
    type: uint32_t
    initial_value: "0"
  - id: next_sync
    type: uint32_t
    initial_value: "0"
  - id: next_poll
    type: uint32_t
    initial_value: "0"
  # Text poll interval: refresh_s of the last sync; one minute until then.
  - id: poll_ms
    type: uint32_t
    initial_value: "60000"
  # beep and blink in the last sync (ADR 0131): the rule wants the device to
  # signal. The device runs the method it has.
  - id: beep_pending
    type: bool
    initial_value: "false"
  - id: blink_pending
    type: bool
    initial_value: "false"
  - id: fw_path
    type: std::string
    initial_value: '""'
  - id: fw_md5
    type: std::string
    initial_value: '""'
  - id: fw_offered
    type: std::string
    initial_value: '""'
  - id: setup_shown
    type: std::string
    initial_value: '""'
  # Pairing (ADR 0109): the code the server asks for.
  - id: pair_code
    type: std::string
    initial_value: '""'

http_request:
  useragent: paperboy-esphome
  timeout: 5s
  # The certificate of an https Paperboy URL is verified against the ESP-IDF CA
  # bundle (ADR 0108). Plain http in the LAN is unaffected.

# The clock the certificate check needs. A boot has no time until SNTP answered,
# so register, sync and poll only run once there is one; a device that stays up
# keeps it and Paperboy's sync answer corrects it.
time:
  - platform: sntp
    timezone: UTC
    servers:
      - ${ntp_server}
      - time.cloudflare.com
    update_interval: 24h

interval:
  # One tick per second only decides what is due: setup instructions (local),
  # register, sync or text poll, each paced by its own next_* time. The
  # scripts are single, so a slow request never piles up.
  - interval: 1s
    then:
      - if:
          condition:
            not: wifi.connected
          then:
            - script.execute: { id: show_setup, reason: "wifi" }
          else:
            - if:
                condition:
                  lambda: "return pb_base(id(paperboy_url).state).empty();"
                then:
                  - script.execute: { id: show_setup, reason: "url" }
                else:
                  - if:
                      condition:
                        lambda: "return id(api_key).state.empty();"
                      then:
                        - if:
                            condition:
                              lambda: "return millis() >= id(next_register) && !id(do_register).is_running() && pb_clock_ready(pb_base(id(paperboy_url).state));"
                            then:
                              - script.execute: do_register
                            else:
                              # An https Paperboy URL cannot be verified without a
                              # clock; SNTP is still on its way (ADR 0108).
                              - if:
                                  condition:
                                    lambda: "return !pb_clock_ready(pb_base(id(paperboy_url).state));"
                                  then:
                                    - script.execute: { id: show_setup, reason: "clock" }
                      else:
                        - if:
                            condition:
                              lambda: "return millis() >= id(next_sync) && pb_clock_ready(pb_base(id(paperboy_url).state));"
                            then:
                              - if:
                                  condition:
                                    not:
                                      script.is_running: do_sync
                                  then:
                                    - script.execute: do_sync
                            else:
                              - if:
                                  condition:
                                    lambda: |-
                                      return millis() >= id(next_poll) && !id(do_sync).is_running() &&
                                             !id(do_poll).is_running() &&
                                             pb_clock_ready(pb_base(id(paperboy_url).state));
                                  then:
                                    - script.execute: do_poll

script:
  # The marquee of the current page (ADR 0117): every box waits its own step
  # from the sync answer, so no fixed interval drives it. The delay yields, so
  # Wi-Fi, the web server and OTA keep running while a line scrolls.
  - id: text_scroll
    mode: restart
    then:
      - while:
          condition:
            lambda: "return pb_has_scroll();"
          then:
            - delay: !lambda "return pb_scroll_wait_ms();"
            - if:
                condition:
                  lambda: "return pb_scroll_tick();"
                then:
                  - component.update: text_display

  - id: show_setup
    mode: single
    parameters:
      reason: string
    then:
      - lambda: |-
          std::string t;
          if (reason == "wifi") {
            t = "Setup: join Wi-Fi\n" + App.get_name();
          } else if (reason == "url") {
            auto ips = wifi::global_wifi_component->get_ip_addresses();
            char ip[48] = "?";
            if (ips[0].is_set()) {
              ips[0].str_to(ip);
            }
            t = "Setup: open\nhttp://" + std::string(ip) + "/\nenter Paperboy URL";
          } else if (reason == "clock") {
            t = "No clock for https\ncheck NTP or use http";
          } else if (reason == "pair") {
            t = "Pairing code:\n" + id(pair_code);
          } else {
            t = "Unknown display\nClaim it in Paperboy\n" + id(mac);
          }
          if (t != id(setup_shown)) {
            id(setup_shown) = t;
            pb_show_message(t);
            ESP_LOGW("paperboy", "setup needed: %s", reason.c_str());
          }
      - component.update: text_display

  # POST /api/device/register trades the MAC for the device key; 403 means
  # the MAC is not in paperboy.yaml. Any failure waits a minute.
  - id: do_register
    mode: single
    then:
      - lambda: "id(next_register) = millis() + 60000;"
      - http_request.post:
          url: !lambda 'return pb_base(id(paperboy_url).state) + "/api/device/register";'
          capture_response: true
          max_response_buffer_size: 512
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            return "{\"mac\":" + pb_json_string(id(mac)) +
                   ",\"hardware\":\"${hardware}\",\"firmware\":\"${fw_version}\"}";
          on_response:
            then:
              - lambda: |-
                  std::string key;
                  if (response->status_code == 200) {
                    json::parse_json(body, [&](JsonObject root) -> bool {
                      key = root["key"] | "";
                      return true;
                    });
                  }
                  if (!key.empty()) {
                    id(api_key).make_call().set_value(key).perform();
                    id(next_sync) = 0;
                    id(setup_shown) = "";
                    id(pair_code) = "";
                    ESP_LOGI("paperboy", "registered with Paperboy");
                  } else {
                    ESP_LOGW("paperboy", "registration refused: HTTP %d", response->status_code);
                  }
                  // A register without the operator's confirmation answers
                  // with the code the LCD shows (ADR 0109).
                  if (response->status_code == 403) {
                    json::parse_json(body, [&](JsonObject root) -> bool {
                      id(pair_code) = root["code"] | "";
                      return true;
                    });
                  } else {
                    id(pair_code) = "";
                  }
              - if:
                  condition:
                    lambda: "return response->status_code == 403 && !id(pair_code).empty();"
                  then:
                    - script.execute: { id: show_setup, reason: "pair" }
              - if:
                  condition:
                    lambda: "return response->status_code == 403 && id(pair_code).empty();"
                  then:
                    - script.execute: { id: show_setup, reason: "unknown" }
          on_error:
            then:
              - logger.log: "registration request failed"

  # POST /api/device/sync: reports firmware, RSSI and log, takes the text, the
  # next sync time and a firmware offer.
  - id: do_sync
    mode: single
    then:
      - lambda: |-
          id(auth_header) = "Bearer " + id(api_key).state;
          id(fw_path) = "";
          // Retry in 30 s unless Paperboy answers with its refresh.
          id(next_sync) = millis() + 30000;
      - http_request.post:
          url: !lambda 'return pb_base(id(paperboy_url).state) + "/api/device/sync";'
          capture_response: true
          max_response_buffer_size: 2048
          request_headers:
            Content-Type: application/json
            Authorization: !lambda "return id(auth_header).c_str();"
          body: !lambda |-
            return pb_sync_body("${fw_version}", "${hardware}", id(wake_reason),
                                (int) wifi::global_wifi_component->wifi_rssi());
          on_response:
            then:
              - lambda: |-
                  int status = response->status_code;
                  if (status == 401) {
                    ESP_LOGW("paperboy", "key rejected, registering again");
                    id(api_key).make_call().set_value("").perform();
                    return;
                  }
                  if (status != 200) {
                    ESP_LOGW("paperboy", "sync: HTTP %d", status);
                    pb_note_for_next_wake(str_sprintf("sync answered HTTP %d", status));
                    return;
                  }
                  id(wake_reason) = "timer";
                  pb_text_changed = false;
                  bool changed = false;
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    // refresh_s comes from the plan and paces the text poll;
                    // the sync itself runs at most once a minute (ADR 0045).
                    int refresh = std::max(1, (int) (root["refresh_s"] | 60));
                    id(poll_ms) = (uint32_t) refresh * 1000;
                    id(next_poll) = millis() + id(poll_ms);
                    id(next_sync) = millis() + (uint32_t) std::max(refresh, 60) * 1000;
                    changed = pb_take_text(root["text"]);
                    // The server sets beep and blink when a rule wants the
                    // device to signal (ADR 0131). The hardware file defines
                    // the scripts.
                    id(beep_pending) = root["beep"] | false;
                    id(blink_pending) = root["blink"] | false;
                    // The server's time keeps the clock for the certificate
                    // check of an https URL accurate (ADR 0108).
                    pb_set_clock(root["time"] | 0);
                    id(fw_offered) = root["firmware"]["version"] | "";
                    id(fw_path) = root["firmware"]["path"] | "";
                    id(fw_md5) = root["firmware"]["md5"] | "";
                    return true;
                  });
                  pb_sync_done();
                  id(setup_shown) = "";
                  pb_text_changed = changed;
              - if:
                  condition:
                    lambda: "return id(beep_pending);"
                  then:
                    - lambda: "id(beep_pending) = false;"
                    - script.execute: beep
              - if:
                  condition:
                    lambda: "return id(blink_pending);"
                  then:
                    - lambda: "id(blink_pending) = false;"
                    - script.execute: blink
              - if:
                  condition:
                    lambda: "return pb_text_changed;"
                  then:
                    - if:
                        condition:
                          lambda: "return pb_has_scroll();"
                        then:
                          - script.execute: text_scroll
                        else:
                          - script.stop: text_scroll
                    - component.update: text_display
          on_error:
            then:
              - lambda: 'pb_note_for_next_wake("sync request failed");'
              - logger.log: "sync request failed"
      - if:
          condition:
            lambda: "return !id(fw_path).empty() && !id(fw_md5).empty();"
          then:
            # Paperboy decided; the device flashes and reboots, and the next
            # sync reports the result.
            - lambda: |-
                ESP_LOGI("paperboy", "firmware update ${fw_version} -> %s", id(fw_offered).c_str());
                pb_show_message("Installing update\nv" + id(fw_offered));
            - component.update: text_display
            - ota.http_request.flash:
                url: !lambda "return pb_base(id(paperboy_url).state) + id(fw_path);"
                md5: !lambda "return id(fw_md5);"
            - lambda: |-
                pb_note_for_next_wake("firmware update to " + id(fw_offered) + " failed");
                id(fw_path) = "";
                pb_text_hash.clear();

  # GET /api/device/text?shown=<hash>; 204 = unchanged, the display stays as
  # is. ESPHome logs every non-2xx answer as a failed request.
  - id: do_poll
    mode: single
    then:
      - lambda: |-
          id(auth_header) = "Bearer " + id(api_key).state;
          id(next_poll) = millis() + id(poll_ms);
      - http_request.get:
          url: !lambda 'return pb_base(id(paperboy_url).state) + "/api/device/text?shown=" + pb_text_hash;'
          capture_response: true
          # Lines plus the full text of scrolling rows (ADR 0092).
          max_response_buffer_size: 2048
          request_headers:
            Authorization: !lambda "return id(auth_header).c_str();"
          on_response:
            then:
              - lambda: |-
                  int status = response->status_code;
                  if (status == 204) {
                    return;
                  }
                  if (status == 401) {
                    ESP_LOGW("paperboy", "key rejected, registering again");
                    id(api_key).make_call().set_value("").perform();
                    return;
                  }
                  if (status != 200) {
                    ESP_LOGW("paperboy", "text poll: HTTP %d", status);
                    return;
                  }
                  pb_text_changed = false;
                  json::parse_json(body, [&](JsonObject root) -> bool {
                    pb_text_changed = pb_take_text(root);
                    return true;
                  });
              - if:
                  condition:
                    lambda: "return pb_text_changed;"
                  then:
                    - if:
                        condition:
                          lambda: "return pb_has_scroll();"
                        then:
                          - script.execute: text_scroll
                        else:
                          - script.stop: text_scroll
                    - component.update: text_display
          on_error:
            then:
              - logger.log:
                  level: DEBUG
                  format: "text poll failed"
