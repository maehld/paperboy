# Paperboy firmware for an HD44780 text display with 20 x 4 characters behind
# a PCF8574 I2C expander on an ESP32 dev board (ADR 0044). The shared cycle
# lives in text-common.yaml; this file holds the hardware.
#
# Configure the display type in paperboy.yaml with kind: text, size: [20, 4]
# and charset: hd44780; the firmware maps ä ö ü ß ° µ to the A00 ROM codes.
# A box with overflow: scroll shows its full text as a marquee or a moving
# window; the step and the direction come from the sync answer (ADR 0117).

substitutions:
  hardware: lcd2004
  # 2.7.0 adds the beep and blink scripts of the sync answer (ADR 0131).
  # 2.6.0 combined the scroll engine with the update screen of 2.5.0.
  fw_version: "2.8.0"
  # Characters per row; the display lambda prints each row in this width.
  text_columns: "20"
  # Optional default for the Paperboy URL entered in the web UI.
  default_paperboy_url: ""
  # NTP server for the clock that the certificate check of an https Paperboy
  # URL needs (ADR 0108). A network that blocks the pool points this at its
  # router.
  ntp_server: "pool.ntp.org"

packages:
  paperboy: !include text-common.yaml

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

i2c:
  sda: GPIO21
  scl: GPIO22

display:
  - platform: lcd_pcf8574
    id: text_display
    dimensions: 20x4
    address: 0x27
    update_interval: never
    lambda: |-
      for (int row = 0; row < 4; row++) {
        it.print(0, row, pb_hd44780(pb_row(row, ${text_columns})).c_str());
      }

script:
  # A signal is a beep or a blink; this display has a backlight but no buzzer,
  # so its beep script does nothing (ADR 0131).
  - id: beep
    mode: single
    then:
      - lambda: "// the LCD2004 has no buzzer"
  - id: blink
    mode: single
    then:
      - lambda: "id(text_display).no_backlight();"
      - delay: 200ms
      - lambda: "id(text_display).backlight();"
      - delay: 150ms
      - lambda: "id(text_display).no_backlight();"
      - delay: 200ms
      - lambda: "id(text_display).backlight();"
