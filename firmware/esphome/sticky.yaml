# Paperboy firmware for the Seeed reTerminal Sticky (ADR 0041). The shared
# cycle and the device API live in common.yaml; this file holds the hardware.
#
# Buttons by role (ADR 0042): down = next, up = previous, ok = home.

substitutions:
  hardware: sticky
  fw_version: "2.5.0"
  # Optional default for the Paperboy URL entered in the web UI.
  default_paperboy_url: ""

packages:
  paperboy: !include common.yaml

esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            // The power latch and the charge enable are held through deep
            // sleep (see on_shutdown).
            gpio_hold_dis(GPIO_NUM_39);
            gpio_hold_dis(GPIO_NUM_45);
            gpio_hold_dis(GPIO_NUM_46);
    - priority: 600
      then:
        - output.turn_on: charge_enable
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        - lambda: |-
            auto cause = esp_sleep_get_wakeup_cause();
            if (cause == ESP_SLEEP_WAKEUP_EXT1) {
              uint64_t pins = esp_sleep_get_ext1_wakeup_status();
              id(wake_reason) = "button";
              if (pins & (1ULL << 5)) {
                id(wake_role) = "previous";
                id(wake_gpio) = 5;
              } else if (pins & (1ULL << 6)) {
                id(wake_role) = "next";
                id(wake_gpio) = 6;
              } else {
                id(wake_role) = "home";
                id(wake_gpio) = 4;
              }
            } else if (cause == ESP_SLEEP_WAKEUP_TIMER) {
              id(wake_reason) = "timer";
            } else {
              id(wake_reason) = "powercycle";
            }
            ESP_LOGI("paperboy", "wake reason: %s", id(wake_reason).c_str());
        - if:
            condition:
              lambda: "return !id(wake_role).empty();"
            then:
              - script.execute:
                  id: button_pressed
                  role: !lambda "return id(wake_role);"
                  gpio: !lambda "return id(wake_gpio);"
                  start: !lambda "return (int) esphome::millis();"
              - lambda: 'id(wake_role) = "";'
  on_shutdown:
    - priority: 100
      then:
        - lambda: |-
            gpio_set_level(GPIO_NUM_42, 0);  // touch panel power off
            gpio_hold_en(GPIO_NUM_39);
            gpio_hold_en(GPIO_NUM_45);
            gpio_hold_en(GPIO_NUM_46);
            gpio_deep_sleep_hold_en();

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: octal

logger:
  hardware_uart: UART0

output:
  # The BQ25616 charge enable (EN_BAT_CHGn) is active LOW (Seeed's Arduino and
  # ESPHome examples drive it low), so the output is inverted: turning it on
  # enables charging. It stays on through deep sleep like the power latch.
  - platform: gpio
    pin: GPIO39
    inverted: true
    id: charge_enable
  - platform: gpio
    pin: GPIO45
    id: pwr_hold
  - platform: gpio
    pin: GPIO46
    id: pwr_lock

switch:
  - platform: gpio
    pin: GPIO42
    id: touch_power
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14
  miso_pin: GPIO12

i2c:
  - id: i2c_sensor
    scl: GPIO0
    sda: GPIO1
    frequency: 400kHz
  - id: i2c_touch
    scl: GPIO2
    sda: GPIO3
    frequency: 100kHz

binary_sensor:
  # The BQ25616's STAT is the CHARGE_STATE pin: open drain, low while
  # charging. The LED shows the same state; the pull-up lets the firmware
  # read it. Reported as battery.charging, so Paperboy can cross-check the
  # fuel gauge current.
  - platform: gpio
    id: charger_state
    internal: true
    pin: { number: GPIO40, mode: INPUT_PULLUP }
  # Presses while awake are queued and sent with the next sync.
  - platform: gpio
    id: button_ok
    pin: { number: GPIO4, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - script.execute:
          id: button_pressed
          role: "home"
          gpio: 4
          start: !lambda "return (int) esphome::millis();"
  - platform: gpio
    id: button_up
    pin: { number: GPIO5, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - script.execute:
          id: button_pressed
          role: "previous"
          gpio: 5
          start: !lambda "return (int) esphome::millis();"
  - platform: gpio
    id: button_down
    pin: { number: GPIO6, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - script.execute:
          id: button_pressed
          role: "next"
          gpio: 6
          start: !lambda "return (int) esphome::millis();"

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-Sticky-gray4
    # Upright with the buttons at the top left.
    rotation: 180
    update_interval: never
    lambda: |-
      if (pb_splash) {
        pb_draw_splash(it);
      } else if (id(setup_mode)) {
        pb_draw_setup(it, id(setup_font), id(setup_text));
      } else if (!pb_qoi_valid(pb_page_qoi)) {
        // Truncated answer (page larger than the 96 KiB buffer) or not QOI:
        // keep the old picture instead of painting half a page.
        pb_note_for_next_wake("page not paintable: " + id(image_path));
        ESP_LOGE("paperboy", "page is not a complete QOI image");
      } else if (pb_paint_qoi_gray4(it, pb_page_qoi)) {
        pb_paint_pending = true;
      }

touchscreen:
  - platform: gt911
    id: sticky_touch
    i2c_id: i2c_touch
    display: epaper_display
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    # Measured: the panel reports image x as y and image y as x, and the
    # display rotation is not applied to touches.
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    # The panel reports a position continuously while a finger rests on it.
    # pb_touch takes the first report of a contact and drops the rest until
    # on_release, so one tap is one event and a second tap is not swallowed.
    on_touch:
      - script.execute: { id: touched, x: !lambda "return touch.x;", y: !lambda "return touch.y;" }
    on_release:
      - lambda: "pb_touch_release();"

script:
  # The panel paints asynchronously, so after_paint waits until it is idle
  # before it stores the shown hash.
  - id: wait_paint
    then:
      - wait_until:
          condition:
            not:
              epaper_spi.is_updating: epaper_display
          timeout: 15s

  # BQ27220 fuel gauge. Measured: currents and capacities come ten times too
  # large (design capacity 7500 mAh for the 750 mAh cell); state of charge and
  # voltage are correct.
  - id: read_battery
    then:
      - lambda: |-
          auto rd = [](uint8_t reg, int &out) -> bool {
            uint8_t raw[2];
            if (id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2) != i2c::ERROR_OK) {
              return false;
            }
            out = raw[0] | (raw[1] << 8);
            return true;
          };
          int v;
          pb_bat_volts = rd(0x08, v) && v > 0 ? v / 1000.0f : NAN;
          pb_bat_percent = rd(0x2C, v) && v <= 100 ? (float) v : NAN;
          pb_bat_ma = rd(0x0C, v) ? (int16_t) v / 10.0f : NAN;
          pb_bat_mah = rd(0x10, v) ? v / 10.0f : NAN;
          // STAT is low while the charger pushes current. Read the pin here
          // rather than trusting only the gauge, which cannot see a full cell.
          pb_charging = id(charger_state).state ? 0 : 1;
      # USB 5 V reaches GPIO9 through a 5.1k/5.1k divider (PWR_IN_VOLT in the
      # schematic): about 2.5 V with USB, 0 V without (ADR 0051).
      - component.update: usb_volts
      - lambda: |-
          float usb = id(usb_volts).state;
          pb_power = std::isfinite(usb) && usb > 3.0f ? "mains" : "battery";

sensor:
  - platform: adc
    id: usb_volts
    internal: true
    pin: GPIO9
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0   # divider

deep_sleep:
  id: sleeper
  esp32_ext1_wakeup:
    pins:
      - number: GPIO4
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO5
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO6
        mode: INPUT_PULLUP
        allow_other_uses: true
    mode: ANY_LOW
