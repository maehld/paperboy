# Paperboy firmware for the Seeed reTerminal E1001 (ADR 0041). The shared
# cycle and the device API live in common.yaml; this file holds the hardware.
#
# Buttons from left to right: GPIO5 = previous, GPIO4 = next, green GPIO3 =
# home (ADR 0042; confirmed on the device in 0.4.0, where left and middle were
# swapped).
#
# The panel (GDEY075T7, UC8179) supports four gray levels in hardware (2 bpp,
# LUTs), which the uc8179_gray4 component draws without dithering (ADR 0086):
# Paperboy's 0/85/170/255 become black, dark gray, light gray and white, so the
# antialiased font edges of a page survive. Grayscale is full-refresh only.
#
# Panel batches differ in two properties that only the panel knows: the data
# polarity (some render a negative) and the grayscale LUT bank. Both are runtime
# settings of the device, not of the image (ADR 0087): "Invert colors", "LUT
# mode" and "Apply display settings" appear in the device's web UI.

substitutions:
  hardware: e1001
  fw_version: "2.5.0"
  # Optional default for the Paperboy URL entered in the web UI.
  default_paperboy_url: ""
  # Initial option of the LUT mode select; the device remembers a change.
  lut_mode: otp

packages:
  paperboy: !include common.yaml

external_components:
  # Four gray levels on the UC8179 (ADR 0086), pinned to a commit: the
  # repository has no releases and a moved main would change the image silently.
  - source: github://formorer/uc8179_gray4_esphome@61f881b7e970e454a2e8ee503a003276cb0c1b6f
    components: [uc8179_gray4]

esphome:
  on_boot:
    - priority: 600
      then:
        - output.turn_on: battery_enable
        - lambda: |-
            auto cause = esp_sleep_get_wakeup_cause();
            if (cause == ESP_SLEEP_WAKEUP_EXT1) {
              uint64_t pins = esp_sleep_get_ext1_wakeup_status();
              id(wake_reason) = "button";
              if (pins & (1ULL << 5)) {
                id(wake_role) = "previous";
                id(wake_gpio) = 5;
              } else if (pins & (1ULL << 4)) {
                id(wake_role) = "next";
                id(wake_gpio) = 4;
              } else {
                id(wake_role) = "home";
                id(wake_gpio) = 3;
              }
            } else if (cause == ESP_SLEEP_WAKEUP_TIMER) {
              id(wake_reason) = "timer";
            } else {
              id(wake_reason) = "powercycle";
            }
            ESP_LOGI("paperboy", "wake reason: %s", id(wake_reason).c_str());
        - if:
            condition:
              lambda: "return !id(wake_role).empty();"
            then:
              - script.execute:
                  id: button_pressed
                  role: !lambda "return id(wake_role);"
                  gpio: !lambda "return id(wake_gpio);"
                  start: !lambda "return (int) esphome::millis();"
              - lambda: 'id(wake_role) = "";'

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

psram:
  mode: octal

logger:

output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

sensor:
  # Battery voltage through a 1:2 divider; needs battery_enable on.
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0

binary_sensor:
  # Presses while awake are queued and sent with the next sync; left to right.
  - platform: gpio
    id: button_previous
    pin: { number: GPIO5, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - script.execute:
          id: button_pressed
          role: "previous"
          gpio: 5
          start: !lambda "return (int) esphome::millis();"
  - platform: gpio
    id: button_next
    pin: { number: GPIO4, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - script.execute:
          id: button_pressed
          role: "next"
          gpio: 4
          start: !lambda "return (int) esphome::millis();"
  - platform: gpio
    id: button_home
    pin: { number: GPIO3, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - script.execute:
          id: button_pressed
          role: "home"
          gpio: 3
          start: !lambda "return (int) esphome::millis();"

display:
  - platform: uc8179_gray4
    id: epaper_display
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin: GPIO12
    # No `inverted: true`, unlike Seeed's waveshare_epaper template: the driver
    # reads the active-low BUSY signal itself (an inverted flag times out).
    busy_pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
    update_interval: never
    lambda: |-
      // Panel properties, per device (ADR 0087): the settings live in flash and
      // are applied here so that every paint uses them, including the first
      // one after a wake.
      id(epaper_display)->set_invert_colors(id(invert_colors_switch)->state);
      id(epaper_display)->set_lut_mode(id(lut_mode_select)->current_option() == "custom"
                                           ? esphome::uc8179_gray4::LUT_MODE_CUSTOM
                                           : esphome::uc8179_gray4::LUT_MODE_OTP);
      if (pb_splash) {
        it.fill(Color::WHITE);
        pb_draw_splash(it);
      } else if (id(setup_mode)) {
        it.fill(Color::WHITE);
        pb_draw_setup(it, id(setup_font), id(setup_text));
      } else if (!pb_qoi_valid(pb_page_qoi)) {
        // Truncated answer (page larger than the 96 KiB buffer) or not QOI:
        // keep the old picture instead of painting half a page.
        pb_note_for_next_wake("page not paintable: " + id(image_path));
        ESP_LOGE("paperboy", "page is not a complete QOI image");
      } else {
        // pb_paint_qoi_gray4 leaves white pixels alone, so start from white.
        it.fill(Color::WHITE);
        if (pb_paint_qoi_gray4(it, pb_page_qoi)) {
          pb_paint_pending = true;
        }
      }

switch:
  # Some UC8179 batches drive the data planes with the opposite polarity and
  # render every page as a negative (ADR 0087).
  - platform: template
    id: invert_colors_switch
    name: "Invert colors"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

select:
  # The grayscale LUT bank also differs between batches: the wrong one makes the
  # four levels look washed out, swapped or inverted (ADR 0087).
  - platform: template
    id: lut_mode_select
    name: "LUT mode"
    optimistic: true
    restore_value: true
    initial_option: "${lut_mode}"
    options: [otp, custom]

button:
  # An unchanged page is not repainted, so a changed setting needs a paint of its
  # own to show its effect; this is that paint.
  - platform: template
    id: apply_display_settings
    name: "Apply display settings"
    on_press:
      - component.update: epaper_display

script:
  # uc8179_gray4 refreshes synchronously: component.update returns once the
  # panel is idle, so after_paint has nothing to wait for.
  - id: wait_paint
    then:
      - lambda: |-
          // nothing to wait for

  # No fuel gauge on the E1001: the voltage, mapped to a percentage with the
  # discharge curve of a single-cell LiPo.
  - id: read_battery
    then:
      - component.update: battery_voltage
      - lambda: |-
          float v = id(battery_voltage).state;
          pb_bat_volts = std::isfinite(v) && v > 0 ? v : NAN;
          // Seeed's discharge curve for the E10xx (its ESPHome example),
          // linearly interpolated and clamped to 0..100. The ADC measures under
          // the device's own load, so the value reads a little low while it is
          // awake.
          static const float curve[][2] = {
              {3.27f, 0.f},   {3.30f, 5.f},   {3.41f, 10.f}, {3.49f, 20.f},
              {3.58f, 30.f},  {3.68f, 40.f},  {3.75f, 50.f}, {3.80f, 60.f},
              {3.85f, 70.f},  {3.91f, 80.f},  {3.96f, 90.f}, {4.15f, 100.f},
          };
          if (std::isfinite(pb_bat_volts)) {
            const int n = sizeof(curve) / sizeof(curve[0]);
            if (pb_bat_volts >= curve[n - 1][0]) {
              pb_bat_percent = curve[n - 1][1];
            } else if (pb_bat_volts <= curve[0][0]) {
              pb_bat_percent = curve[0][1];
            } else {
              for (int i = 1; i < n; i++) {
                if (pb_bat_volts <= curve[i][0]) {
                  const float v0 = curve[i - 1][0];
                  const float p0 = curve[i - 1][1];
                  pb_bat_percent = p0 + (curve[i][1] - p0) * (pb_bat_volts - v0) / (curve[i][0] - v0);
                  break;
                }
              }
            }
          }
          // No GPIO sees USB power on the E1001 (ADR 0051); power: mains in
          // paperboy.yaml overrides this for a device on a charger.
          pb_power = "battery";

deep_sleep:
  id: sleeper
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO4
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO5
        mode: INPUT_PULLUP
        allow_other_uses: true
    mode: ANY_LOW
