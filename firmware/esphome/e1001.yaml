# Paperboy firmware for the Seeed reTerminal E1001 (ADR 0041). The shared
# cycle and the device API live in common.yaml; this file holds the hardware.
#
# Buttons from left to right: GPIO5 = previous, GPIO4 = next, green GPIO3 =
# home (ADR 0042; confirmed on the device in 0.4.0, where left and middle were
# swapped).
#
# The panel (GDEY075T7, UC8179) supports four gray levels, but ESPHome's
# Seeed-reTerminal-E1001 model drives it in black and white only (1 bpp), so
# Paperboy's gray levels are drawn as a fixed 2x2 pattern (pb_draw_dithered).

substitutions:
  hardware: e1001
  fw_version: "0.5.0"
  # Optional default for the Paperboy URL entered in the web UI.
  default_paperboy_url: ""

packages:
  paperboy: !include common.yaml

esphome:
  on_boot:
    - priority: 600
      then:
        - output.turn_on: battery_enable
        - lambda: |-
            auto cause = esp_sleep_get_wakeup_cause();
            if (cause == ESP_SLEEP_WAKEUP_EXT1) {
              uint64_t pins = esp_sleep_get_ext1_wakeup_status();
              id(wake_reason) = "button";
              if (pins & (1ULL << 5)) {
                pb_button("previous");
              } else if (pins & (1ULL << 4)) {
                pb_button("next");
              } else {
                pb_button("home");
              }
            } else if (cause == ESP_SLEEP_WAKEUP_TIMER) {
              id(wake_reason) = "timer";
            } else {
              id(wake_reason) = "powercycle";
            }
            ESP_LOGI("paperboy", "wake reason: %s", id(wake_reason).c_str());

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

psram:
  mode: octal

logger:

output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

sensor:
  # Battery voltage through a 1:2 divider; needs battery_enable on.
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0

binary_sensor:
  # Presses while awake are queued and sent with the next sync; left to right.
  - platform: gpio
    id: button_previous
    pin: { number: GPIO5, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - script.execute: { id: button_pressed, role: "previous" }
  - platform: gpio
    id: button_next
    pin: { number: GPIO4, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - script.execute: { id: button_pressed, role: "next" }
  - platform: gpio
    id: button_home
    pin: { number: GPIO3, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - script.execute: { id: button_pressed, role: "home" }

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1001
    update_interval: never
    lambda: |-
      if (id(setup_mode)) {
        pb_draw_text(it, id(setup_font), id(setup_text));
      } else {
        pb_draw_dithered(it, id(page_image));
      }

script:
  # No fuel gauge on the E1001: the voltage only.
  - id: read_battery
    then:
      - component.update: battery_voltage
      - lambda: |-
          float v = id(battery_voltage).state;
          pb_bat_volts = std::isfinite(v) && v > 0 ? v : NAN;
          // No GPIO sees USB power on the E1001 (ADR 0051); power: mains in
          // paperboy.yaml overrides this for a device on a charger.
          pb_power = "battery";

deep_sleep:
  id: sleeper
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO4
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO5
        mode: INPUT_PULLUP
        allow_other_uses: true
    mode: ANY_LOW
