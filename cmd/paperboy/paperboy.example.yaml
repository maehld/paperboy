# Paperboy configuration (ADR 0026), placed in the instance directory you pass
# with -config (ADR 0037). The instance directory also holds pages/, plans/,
# providers/ and the state/ directory; no paths are configured here.
# Layout: <dir>/paperboy.yaml, <dir>/pages, <dir>/plans, <dir>/providers,
# <dir>/state/{devices.json,data.json}.

# Optional; default: system language and timezone (ADR 0033).
# language: de            # de or en: built-in texts and number format
# timezone: Europe/Berlin # IANA name; applies to plans and built-in dates

server:
  # public_url: https://paper.example.com   # only needed behind a reverse proxy
  upload_token_env: PAPERBOY_UPLOAD_TOKEN   # or upload_token: "a long random token"

# Optional exec providers (ADR 0036). The program lives in providers/ and prints
# the new value of its branch as JSON on stdout; it gets PAPERBOY_LANGUAGE and
# PAPERBOY_TIMEZONE from Paperboy.
# providers:
#   weather:
#     command: [weather, -lat, "52.52", -lon, "13.40"]
#     path: weather
#     interval: 15m
#     timeout: 30s

defaults:
  refresh: 5m
  page_timeout: 5m
  # battery: { warn_volts: 3.45, critical_volts: 3.3, hysteresis_volts: 0.1 }

display_types:
  e1001:
    kind: image
    size: [800, 480]
    gray_levels: 4
    width_mm: 163
    min_refresh: 60s
  sticky:
    kind: image
    size: [800, 480]
    gray_levels: 4
    width_mm: 86

devices:
  wohnzimmer:
    display_type: e1001
    protocol: trmnl
    mac: "AA:BB:CC:DD:EE:01"
    # plan: standard   # plans/standard.yaml must exist; otherwise a notice page
  flur:
    display_type: sticky
    protocol: trmnl
    mac: "AA:BB:CC:DD:EE:02"
