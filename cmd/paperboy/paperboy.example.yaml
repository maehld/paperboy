# Paperboy configuration (ADR 0026, ADR 0049), placed in the instance directory
# you pass with -config (ADR 0037). Layout: <dir>/paperboy.yaml, <dir>/pages,
# <dir>/plans, <dir>/plugins, <dir>/firmware and <dir>/state/devices.json; no
# paths are configured here.

# Optional; default: system language and timezone (ADR 0033).
# language: de            # de or en: built-in texts, number format, plugins
# timezone: Europe/Berlin # IANA name; applies to plans, clocks and plugins

# Plugins provide the widgets of the pages (ADR 0049). A plugin is a program in
# plugins/ (unpack paperboy-plugins-<os>-<arch>.zip there) or on PATH that keeps
# running and is named like the plugin; Paperboy sends it its config section
# once after the start. ${VAR} in config values comes from the environment, so
# secrets stay out of this file. The built-in plugin "paperboy" (header, text,
# clock) needs no entry.
#
# Downloaded programs are named <plugin>-v<version> (ADR 0060). Without
# "version" the highest one runs; a version pins exactly that program. A
# program without a version in plugins/ always wins (your own build).
plugins:
  evcc:
    config: { url: "http://evcc:7070" }
  weather:
    config: { lat: 52.52, lon: 13.40 }
  pokedex:
    config: { mode: random, rotate: 24h }   # or: { pokemon: pikachu }
  xkcd:
    config: { comic: latest }
  departures:
    config: { stop: "City, Stop name", walk_minutes: 4 }   # Westfalenfahrplan by default, see docs/plugins/departures.md
  myskoda:
    config:
      api_key: ${SKODA_API_KEY}     # created in the MyŠkoda app, bound to the vehicle
      vin: TMBJB9NY5RF999999
      refresh: 1h                   # default; at least 10m (20 requests per hour)
  calendar:
    timeout: 1m
    config:
      caldav: https://caldav.icloud.com
      user: me@icloud.com
      password: ${PAPERBOY_CALDAV_PASSWORD}   # iCloud: app-specific password
      calendars: [Privat]

defaults:
  refresh: 5m
  page_timeout: 5m
  # menu_show_duration: 30s  # how long the device menu stays open (ADR 0057), 5s-60s
  # battery: { warn_volts: 3.45, critical_volts: 3.3, hysteresis_volts: 0.1 }

# Optional firmware updates (ADR 0043) from firmware/<hardware>-v<version>.bin
# in the instance directory; the highest version is offered in the sync.
# firmware:
#   update: auto            # auto or off; default off
#   min_battery_volts: 3.6
#   version: v1.0.0         # optional: exactly these images, also the rollback pin (ADR 0060)

# Optional: fetch plugin programs and firmware images from the releases instead
# of unpacking the zips by hand (ADR 0060). Off without this section.
# download:
#   source: https://github.com/maehld/paperboy   # optional, a fork or mirror
#   token: ${GITHUB_TOKEN}                       # optional: rate limits, private forks
#   interval: 24h                                # optional: between checks, at least 1h

display_types:
  e1001:
    kind: image
    size: [800, 480]
    gray_levels: 4
    ppi: 125          # pixels per inch: 800 px / 163 mm active width
    min_refresh: 60s
    # power: auto      # auto (default: what the firmware reports, else battery), battery or mains (ADR 0051)
  sticky:
    kind: image
    size: [800, 480]
    gray_levels: 4
    ppi: 236          # 800 px / 86 mm
  lcd2004:            # HD44780 text display (ADR 0044); pages use lines instead of blocks
    kind: text
    size: [20, 4]     # columns, rows
    charset: hd44780  # utf8 (default), ascii or hd44780
devices:
  wohnzimmer:
    display_type: e1001
    protocol: paperboy   # Paperboy firmware (ADR 0041, 0042)
    mac: "AA:BB:CC:DD:EE:01"
    plan: standard     # plans/standard.yaml must exist; otherwise a notice page
    # firmware: hold   # keep this device on its firmware version
    # power: mains     # the E1001 cannot detect USB power; set mains when it runs on a charger
    # actions: deny    # do not open the device menu (ADR 0057); default allow
  flur:
    display_type: sticky
    protocol: paperboy   # Paperboy firmware (ADR 0041, 0042)
    mac: "AA:BB:CC:DD:EE:02"
  kueche:
    display_type: lcd2004
    protocol: paperboy   # syncs every refresh, polls GET /api/device/text every second
    mac: "AA:BB:CC:DD:EE:03"
    refresh: 1m
